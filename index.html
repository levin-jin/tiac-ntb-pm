<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T.I.A Document Hub</title>

  <!-- ផ្ទុក Library ពី Internet: Tailwind (រចនាស្ទីល), React (UI), Babel (បម្លែង JSX ឲ្យ Browser យល់) -->
  <link href="https://fonts.googleapis.com/css2?family=Battambang&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>try { tailwind.config = { darkMode: "class" }; } catch (e) { console.warn("Tailwind CDN not loaded", e); }</script> <!-- Night Mode ដំណើរការតាម class "dark" -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script> <!-- Supabase: Database + Google Login + Storage -->

<style>
    .font-khmer { 
      font-family: "Koh Santepheap", "Battambang", sans-serif; 
      font-size: 0.8rem; /* ឬអ្នកអាចដាក់ 17px ក៏បាន ធ្វើការរក្សរទូទៅធំជាងមុនបន្តិច */
    }
    /* ពង្រីកទំហំអក្សរក្នុងតារាង និងកាតផ្សេងៗសម្រាប់ភាសាខ្មែរ */
    .font-khmer body, .font-khmer table, .font-khmer input, .font-khmer button {
      font-size: 0.8rem; 
    }
    .dark { color-scheme: dark; }
  </style>
</head>
<body>
<div id="root"></div>
<div id="boot" style="font-family:sans-serif;padding:24px;color:#64748b">កំពុងផ្ទុក... / Loading...</div>
<script>
(function(){
  function box(msg){
    var d=document.createElement("pre");
    d.style.cssText="position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#fff1f2;color:#be123c;border:1px solid #fda4af;padding:10px;border-radius:8px;font:12px/1.4 monospace;white-space:pre-wrap;max-height:40vh;overflow:auto";
    d.textContent=msg; document.body.appendChild(d);
  }
  window.addEventListener("error",function(e){ box("Error: "+(e.message||e)+(e.lineno?" (line "+e.lineno+")":"")); var b=document.getElementById("boot"); if(b) b.textContent=""; });
  window.addEventListener("unhandledrejection",function(e){ console.warn("Promise error:",e.reason); });
  window.addEventListener("load",function(){
    var warn=[];
    if(!window.supabase) warn.push("Supabase មិនទាន់ផ្ទុក (cdn.jsdelivr.net ត្រូវបានរារាំង?) - កំពុងរត់ជា Demo Mode");
    if(!window.tailwind) warn.push("Tailwind មិនទាន់ផ្ទុក (cdn.tailwindcss.com ត្រូវបានរារាំង?) - ទំព័រអាចគ្មានរចនាប័ទ្ម");
    if(warn.length){ var w=document.createElement("div"); w.style.cssText="position:fixed;top:0;left:0;right:0;z-index:99999;background:#fef3c7;color:#92400e;padding:6px 10px;font:12px sans-serif;text-align:center"; w.textContent=warn.join(" | "); document.body.appendChild(w); }
  });
})();
</script>
