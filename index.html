// រក្សាទុកទិន្នន័យ: localStorage (ជានិច្ច) + Supabase តារាង app_state (បើកំណត់ហើយ)
// សិទ្ធិសរសេរត្រូវបានគ្រប់គ្រងដោយច្បាប់ RLS ក្នុង Database មិនមែនក្នុងកូដនេះទេ
function usePersist(key, initial) {
  const [v, setV] = useState(() => { try { return JSON.parse(localStorage.getItem(key)) ?? initial; } catch { return initial; } });
  const loaded = useRef(!sb);       // Cloud: រង់ចាំអានពី Database រួចសិន មុនសរសេរ
  const fromCloud = useRef(false);  // ទើបទាញពី Cloud → កុំសរសេរត្រឡប់ទៅវិញ

  // អានពី Cloud ពេលបើក និងពេល Login/Logout (សិទ្ធិអានប្តូរ)
  useEffect(() => {
    if (!sb) return;
    const load = () => sb.from("app_state").select("value").eq("key", key).maybeSingle().then(({ data }) => {
      if (data) { fromCloud.current = true; setV(data.value); }
      loaded.current = true;
    });
    load();
    // ប្រុងប្រយ័ត្ន: កុំឲ្យ callback នេះ return Promise ឬហៅ Supabase ផ្ទាល់ ព្រោះបណ្តាលឲ្យ session គាំង (deadlock)
    // ប្រើ setTimeout ដើម្បីហៅបន្ទាប់ពី callback ចប់ ហើយអានតែពេល Login/Logout
    const { data: { subscription } } = sb.auth.onAuthStateChange((event) => {
      if (event === "SIGNED_IN" || event === "SIGNED_OUT") setTimeout(load, 0);
    });
    return () => subscription.unsubscribe();
  }, [key]);

  // សរសេរពេលទិន្នន័យប្តូរ
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(v)); } catch {}
    if (!sb || !loaded.current) return;
    if (fromCloud.current) { fromCloud.current = false; return; }
    sb.from("app_state").upsert({ key, value: v, updated_at: new Date().toISOString() })
      .then(({ error }) => { if (error) console.warn("Cloud save blocked:", error.message); });
  }, [key, v]);
  return [v, setV];
}

// រក្សាទុក File ដែលបាន Upload ក្នុង IndexedDB (ឥតគិតថ្លៃ, ទុកក្នុង Browser)
const openDB = () => new Promise((ok, no) => {
  const r = indexedDB.open("tia-files", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("files");
  r.onsuccess = () => ok(r.result); r.onerror = no;
});
const idbSave = async (id, file) => (await openDB()).transaction("files", "readwrite").objectStore("files").put(file, id);
const idbGet = async (id) => { const db = await openDB(); return new Promise((ok) => { const q = db.transaction("files").objectStore("files").get(id); q.onsuccess = () => ok(q.result); }); };
// ទុក/ទាញ File: Cloud Mode ប្រើ Supabase Storage (bucket "files"), Demo Mode ប្រើ IndexedDB
const fileSave = async (id, file) => (sb ? sb.storage.from("files").upload(id, file, { upsert: true, contentType: file.type || undefined }) : idbSave(id, file));
const fileGet = async (id) => { if (!sb) return idbGet(id); const { data } = await sb.storage.from("files").download(id); return data; };
const guessFormat = (name) => {            // ទាយ Format ពីកន្ទុយឈ្មោះ File
  const ext = name.split(".").pop().toLowerCase();
  if (ext === "pdf") return "PDF";
  if (["xls", "xlsx", "csv"].includes(ext)) return "EXCEL";
  if (["doc", "docx"].includes(ext)) return "WORD";
  if (["dwg", "dxf"].includes(ext)) return "CAD";
  if (["jpg", "jpeg", "png", "gif", "webp", "heic"].includes(ext)) return "PHOTO";
  if (["zip", "rar", "7z"].includes(ext)) return "ZIP";
  return "OTHER";
};

// កាត់រូបស្វ័យប្រវត្តិទៅ 16:9 (800x450) ពីកណ្តាលរូប
function cropImage(file, w = 800, h = 450, q = 0.82) {
  return new Promise((ok) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const k = Math.max(w / img.width, h / img.height), sw = w / k, sh = h / k;
      c.getContext("2d").drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
      ok(c.toDataURL("image/jpeg", q));
    };
    img.src = URL.createObjectURL(file);
  });
}

  const c = w && w.current;

        <div className="flex items-center gap-3">

              <div className="text-slate-500">{tm.slice(11, 16)}</div><div>{WX(w.hourly.weather_code[h0 + k])}</div>
              <div className="font-bold">{Math.round(w.hourly.temperature_2m[h0 + k])}°</div>

            </div>

          {w.daily.time.slice(1).map((d, k) => (

              <span>{WX(w.daily.weather_code[k + 1])}</span><b>{Math.round(w.daily.temperature_2m_max[k + 1])}° / {Math.round(w.daily.temperature_2m_min[k + 1])}°</b></div>
          ))}

// កម្មវិធីបញ្ចាំងរូបថត Drone (ប្តូររូបស្វ័យប្រវត្តិរៀងរាល់ ៤ វិនាទី) + ប៊ូតុង Upload រូប 10
function DroneGallery({ images, title, onUpload, uploadLabel }) {
  const [index, setIndex] = useState(0);
  const [playing, setPlaying] = useState(true);
  useEffect(() => {
    if (!playing || images.length < 2) return;
    const timer = setInterval(() => setIndex((i) => (i + 1) % images.length), 4000);
    return () => clearInterval(timer);
  }, [playing, images.length]);
  const current = images[index % Math.max(1, images.length)];
  const btn = "p-1 rounded border border-inherit hover:bg-slate-200 dark:hover:bg-slate-800";
  return (
    <div>
      <CardTitle icon="Image" right={
        <div className="flex items-center gap-1">
          {onUpload && (
            <label className="px-2 py-0.5 rounded bg-emerald-600 text-white text-[10px] font-bold cursor-pointer">
              {uploadLabel}<input type="file" accept="image/*" multiple hidden onChange={onUpload} />
            </label>
          )}
          <button className={btn} onClick={() => setIndex((i) => (i - 1 + images.length) % images.length)}><Icon name="ChevronLeft" size={14} /></button>
          <button className={btn} onClick={() => setIndex((i) => (i + 1) % images.length)}><Icon name="ChevronRight" size={14} /></button>
          <button className={btn} onClick={() => setPlaying(!playing)}><Icon name={playing ? "Pause" : "Play"} size={14} /></button>
        </div>
      }>{title}</CardTitle>
      {current ? (
        <div className="relative rounded-md overflow-hidden aspect-video border border-inherit">
          <img src={current.url} alt="Drone view" className="w-full h-full object-cover" />
          <div className="absolute bottom-0 inset-x-0 px-3 pt-10 pb-2.5 bg-gradient-to-t from-black/65 via-black/25 to-transparent text-white text-[12px] font-bold flex items-end justify-between gap-2 pointer-events-none">
            <span className="truncate" style={{ textShadow: "0 1px 4px rgba(0,0,0,.85)" }}>{current.caption}</span>
            <span className="shrink-0 font-mono text-[10px] px-2 py-0.5 rounded-full bg-white/20 backdrop-blur-md border border-white/30 text-white">{index % images.length + 1} / {images.length}</span>
          </div>
        </div>
      ) : <div className="text-xs text-slate-500 py-6 text-center">No photos yet.</div>}
    </div>
  );
}

/* =====================================================================
   ផ្នែកទី ៥៖ App ចម្បង
   ===================================================================== */
/* =====================================================================
   Widget ថ្មី: របារ Gradient, រង្វង់ភាគរយ, ស្ថានភាពការងារ
   ពណ៌ស៊ីគ្នាជាមួយ S-Curve: ខៀវ = Plan/កម្លាំង, ក្រហម = យឺត, បៃតង = ទៅតាមផែនការ, លឿង = គ្រឿងចក្រ/ពេលវេលា
   ===================================================================== */
const PALETTE = {
  blue:    ["#3B5BDB", "#6C8CFF"],
  emerald: ["#059669", "#34D399"],
  amber:   ["#F59E0B", "#FCD34D"],
  rose:    ["#E11D48", "#FB7185"],
};
const RING_PATH = "M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831";

// របារ Gradient + ស្លាកតម្រុយ (marker) សម្រាប់ជាប់ផែនការ
function GradientBar({ percent, colors, height = "h-2.5", marker = null }) {
  const p = Math.max(0, Math.min(100, Number(percent) || 0));
  return (
    <div className={`relative w-full ${height} rounded-full bg-slate-200/70 dark:bg-slate-800`}>
      <div className="h-full rounded-full" style={{ width: `${p}%`, background: `linear-gradient(90deg, ${colors[0]}, ${colors[1]})`,
        boxShadow: `0 2px 8px -2px ${colors[0]}88`, transition: "width .8s cubic-bezier(.22,.8,.3,1)" }} />
      {marker != null && (
        <div className="absolute -top-[3px] -bottom-[3px] w-[3px] rounded bg-slate-700 dark:bg-slate-100 ring-2 ring-white dark:ring-[#0F0F0F]"
          style={{ left: `calc(${Math.max(0, Math.min(100, marker))}% - 1.5px)` }} />
      )}
    </div>
  );
}

// រង្វង់ភាគរយ ជាមួយលេខនៅកណ្ដាល
function RingProgress({ pct }) {
  return (
    <div className="relative w-20 h-20 shrink-0">
      <svg className="w-full h-full -rotate-90" viewBox="0 0 36 36">
        <defs>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stopColor="#34D399" /><stop offset="1" stopColor="#0891B2" />
          </linearGradient>
        </defs>
        <path d={RING_PATH} fill="none" strokeWidth="4" stroke="#FB7185" strokeOpacity="0.22" />
        <path d={RING_PATH} fill="none" strokeWidth="4" strokeLinecap="round" stroke="url(#ringGrad)"
          strokeDasharray={`${pct}, 100`} style={{ transition: "stroke-dasharray .8s cubic-bezier(.22,.8,.3,1)" }} />
      </svg>
      <div className="absolute inset-0 grid place-items-center text-[15px] font-black">{pct}%</div>
    </div>
  );
}

// ស្ថានភាព Milestone តាមគម្លាត (Actual - Planned): ស៊ីគ្នាជាមួយ Gap ក្នុង S-Curve
function milestoneStatus(item) {
  const gap = Number(item.actual) - Number(item.planned);
  if (Number(item.actual) >= 100) return { label: "Completed", colors: PALETTE.emerald, chip: "bg-emerald-500/15 text-emerald-600 dark:text-emerald-400", gap };
  if (gap >= 0)  return { label: "On track",  colors: PALETTE.emerald, chip: "bg-emerald-500/15 text-emerald-600 dark:text-emerald-400", gap };
  if (gap >= -15) return { label: "Slight delay", colors: PALETTE.amber, chip: "bg-amber-500/15 text-amber-600 dark:text-amber-400", gap };
  return { label: "Delayed", colors: PALETTE.rose, chip: "bg-rose-500/15 text-rose-600 dark:text-rose-400", gap };
}

// បន្ទះពណ៌ស្តើងលើកំពូលកាត
const Accent = ({ colors }) => <div className="absolute inset-x-0 top-0 h-[3px]" style={{ background: `linear-gradient(90deg, ${colors[0]}, ${colors[1]})` }} />;

// ក្រាប S-Curve: Planned (ខៀវ) និង Actual (ក្រហម)
// - ដាក់ mouse / ប៉ះ: បន្ទាត់ណែនាំរត់តាម mouse បន្តបន្ទាប់ តាមបណ្តោយខ្សែ
// - Tooltip គណនា % នៅចំណុចនោះពីខ្សែកោងពិតប្រាកដ (interpolation) ហើយ "ជាប់" ត្រង់ខែ ពេលជិតខែ
// - Tooltip ជាកញ្ចក់ថ្លា មើលទិន្នន័យខាងក្រោយបាន
function SCurveChart({ data, width = 0, rotated = false }) {
  const [hp, setHp] = useState(null);          // ទីតាំង mouse ក្នុងឯកតា viewBox (បន្តបន្ទាប់)
  const lastPx = useRef(null);
  const wasVisible = useRef(false);
  const W = 600, H = 300, L = 44, R = 30, T = 30, B = 46;
  const n = data.length;
  const x = (i) => (n < 2 ? (L + W - R) / 2 : L + (i * (W - L - R)) / (n - 1));
  const y = (v) => T + (1 - Number(v) / 100) * (H - T - B);
  const yToVal = (py) => (1 - (py - T) / (H - T - B)) * 100;
  const has = (v) => Number(v) > 0;
  const base = y(0);

  const SERIES = [
    { key: "planned", name: "Planned", line: "#3B5BDB", text: "#3B5BDB", grad: "scGradPlanned" },
    { key: "actual",  name: "Actual",  line: "#E11D48", text: "#E11D48", grad: "scGradActual" },
  ];

  // tangent (monotone cubic) នៃចំណុចនីមួយៗ
  const tangents = (p) => {
    const m = p.length;
    if (m < 2) return [0];
    const s = [];
    for (let i = 0; i < m - 1; i++) s.push((p[i + 1][1] - p[i][1]) / (p[i + 1][0] - p[i][0]));
    const t = new Array(m);
    t[0] = s[0]; t[m - 1] = s[m - 2];
    for (let i = 1; i < m - 1; i++) t[i] = s[i - 1] * s[i] <= 0 ? 0 : (s[i - 1] + s[i]) / 2;
    for (let i = 0; i < m - 1; i++) {
      if (s[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; }
      const a = t[i] / s[i], b = t[i + 1] / s[i], q = a * a + b * b;
      if (q > 9) { const k = 3 / Math.sqrt(q); t[i] = k * a * s[i]; t[i + 1] = k * b * s[i]; }
    }
    return t;
  };
  const smooth = (p, t) => {
    let d = `M${p[0][0]},${p[0][1]}`;
    for (let i = 0; i < p.length - 1; i++) {
      const dx = (p[i + 1][0] - p[i][0]) / 3;
      d += ` C${p[i][0] + dx},${p[i][1] + t[i] * dx} ${p[i + 1][0] - dx},${p[i + 1][1] - t[i + 1] * dx} ${p[i + 1][0]},${p[i + 1][1]}`;
    }
    return d;
  };

  // ផ្នែកបន្តបន្ទាប់នៃខ្សែនីមួយៗ (ខែ 0% មិនភ្ជាប់)
  const curves = SERIES.map((s) => {
    const out = []; let cur = [];
    data.forEach((d, i) => {
      if (has(d[s.key])) cur.push([x(i), y(d[s.key])]);
      else if (cur.length) { out.push(cur); cur = []; }
    });
    if (cur.length) out.push(cur);
    return out.map((p) => ({ p, t: tangents(p) }));
  });

  // គណនាតម្លៃ % នៅទីតាំង px ណាមួយលើខ្សែកោង (Hermite = ត្រូវនឹង bezier ដែលគូរ)
  const valueAt = (si, px) => {
    for (const { p, t } of curves[si]) {
      if (p.length < 2 || px < p[0][0] - 0.01 || px > p[p.length - 1][0] + 0.01) continue;
      let i = 0;
      while (i < p.length - 2 && px > p[i + 1][0]) i++;
      const dx = p[i + 1][0] - p[i][0], u = (px - p[i][0]) / dx;
      const u2 = u * u, u3 = u2 * u;
      const py = (2 * u3 - 3 * u2 + 1) * p[i][1] + (u3 - 2 * u2 + u) * dx * t[i] + (-2 * u3 + 3 * u2) * p[i + 1][1] + (u3 - u2) * dx * t[i + 1];
      return Math.max(0, Math.min(100, yToVal(py)));
    }
    return null;
  };

  const labelAbove = (d, key) => (key === "planned" ? Number(d.planned) >= Number(d.actual) : Number(d.actual) > Number(d.planned));

  const onMove = (e) => {
    if (n < 2) return;
    const r = e.currentTarget.getBoundingClientRect();
    let px = rotated ? ((e.clientY - r.top) / r.height) * W : ((e.clientX - r.left) / r.width) * W;
    px = Math.max(x(0), Math.min(x(n - 1), px));
    for (let i = 0; i < n; i++) if (Math.abs(px - x(i)) < 6) { px = x(i); break; } // ជាប់ត្រង់ខែ
    lastPx.current = px;
    setHp(px);
  };

  const visible = hp != null;
  const px = lastPx.current ?? x(0);
  let near = 0;
  for (let i = 1; i < n; i++) if (Math.abs(x(i) - px) < Math.abs(x(near) - px)) near = i;
  const snapped = Math.abs(x(near) - px) < 0.5;
  let seg = 0;
  while (seg < n - 2 && px > x(seg + 1)) seg++;
  const label = snapped ? data[near].month : `${data[seg].month} → ${data[seg + 1] ? data[seg + 1].month : ""}`;
  const r1 = (v) => Math.round(v * 10) / 10;
  const vals = SERIES.map((s, si) => { const v = valueAt(si, px); return v == null ? null : r1(v); });
  const gap = vals[0] != null && vals[1] != null ? r1(vals[1] - vals[0]) : null;
  const animate = wasVisible.current;
  wasVisible.current = visible;
  const flip = px > (L + W - R) / 2 + 20;
  const follow = animate ? "transform .1s ease-out, opacity .15s" : "opacity .15s";

  return (
    <div className={width ? "" : "overflow-x-auto"} style={width ? { width } : undefined}>
      <div className="relative" style={{ minWidth: width ? 0 : 520 }}>
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto select-none block" style={{ touchAction: "pan-y" }}
          onPointerMove={onMove} onPointerDown={onMove} onPointerLeave={(e) => e.pointerType === "mouse" && setHp(null)}>
          <defs>
            <linearGradient id="scGradPlanned" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#3B5BDB" stopOpacity="0.18" /><stop offset="100%" stopColor="#3B5BDB" stopOpacity="0" />
            </linearGradient>
            <linearGradient id="scGradActual" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#E11D48" stopOpacity="0.20" /><stop offset="100%" stopColor="#E11D48" stopOpacity="0" />
            </linearGradient>
          </defs>

          {[0, 25, 50, 75, 100].map((g) => (
            <g key={g}>
              <line x1={L} x2={W - R} y1={y(g)} y2={y(g)} strokeDasharray={g === 0 ? "0" : "3 5"} className="stroke-slate-200 dark:stroke-slate-800" />
              <text x={L - 10} y={y(g) + 3} textAnchor="end" style={{ fontSize: 9.5 }} className="fill-slate-400 dark:fill-slate-500 font-mono">{g}%</text>
            </g>
          ))}

          {data.map((d, i) => (
            <text key={i} x={x(i)} y={H - 18} textAnchor="middle"
              style={{ fontSize: 10, fontWeight: visible && near === i ? 700 : 500, transition: "fill .15s" }}
              className={`font-mono ${visible && near === i ? "fill-slate-900 dark:fill-white" : "fill-slate-400 dark:fill-slate-500"}`}>{d.month}</text>
          ))}

          {/* បន្ទាត់ណែនាំ: រត់តាម mouse */}
          <g style={{ transform: `translateX(${px}px)`, transition: follow, opacity: visible ? 1 : 0 }} pointerEvents="none">
            <line x1={0} x2={0} y1={T - 6} y2={base} strokeWidth="1" strokeDasharray="3 3" className="stroke-slate-400 dark:stroke-slate-500" />
          </g>

          {SERIES.map((s, si) => (
            <g key={s.key}>
              {curves[si].map(({ p, t }, k) => p.length > 1 && (
                <g key={k}>
                  <path d={`${smooth(p, t)} L${p[p.length - 1][0]},${base} L${p[0][0]},${base} Z`} fill={`url(#${s.grad})`} />
                  <path d={smooth(p, t)} fill="none" stroke={s.line} strokeWidth="2.75" strokeLinecap="round" strokeLinejoin="round" />
                </g>
              ))}
            </g>
          ))}

          {SERIES.map((s) => (
            <g key={s.key}>
              {data.map((d, i) => {
                if (!has(d[s.key])) return null;
                const active = visible && snapped && near === i;
                const above = labelAbove(d, s.key);
                return (
                  <g key={i}>
                    {active && <circle cx={x(i)} cy={y(d[s.key])} r="11" fill={s.line} opacity="0.15" />}
                    <circle cx={x(i)} cy={y(d[s.key])} r={active ? 6 : 3.75} fill={s.line}
                      className="stroke-white dark:stroke-slate-900" strokeWidth="2" style={{ transition: "r .15s" }} />
                    <text x={x(i)} y={y(d[s.key]) + (above ? -11 : 19)} textAnchor="middle"
                      className="stroke-white/90 dark:stroke-slate-900/90"
                      style={{ fontSize: 10, fontWeight: 700, fill: s.text, paintOrder: "stroke", strokeWidth: 3.5, strokeLinejoin: "round",
                               opacity: visible && !active ? 0.3 : 1, transition: "opacity .2s" }}>{d[s.key]}%</text>
                  </g>
                );
              })}
            </g>
          ))}

          {/* ចំណុចរអិលលើខ្សែ (ពេល mouse នៅចន្លោះខែ) */}
          {visible && !snapped && SERIES.map((s, si) => vals[si] != null && (
            <g key={s.key} pointerEvents="none">
              <circle cx={px} cy={y(vals[si])} r="9" fill={s.line} opacity="0.15" />
              <circle cx={px} cy={y(vals[si])} r="4.5" fill={s.line} className="stroke-white dark:stroke-slate-900" strokeWidth="2" />
            </g>
          ))}
        </svg>

        <div className="absolute pointer-events-none"
          style={{ left: `${(px / W) * 100}%`, top: `${((T + 4) / H) * 100}%`, opacity: visible ? 1 : 0,
                   transition: animate ? "left .1s ease-out, opacity .15s" : "opacity .15s" }}>
          <div className="w-[158px] rounded-xl px-3 py-2.5 border shadow-lg backdrop-blur-md backdrop-saturate-150
                          bg-white/55 border-white/70 dark:bg-slate-900/55 dark:border-slate-600/50"
               style={{ transform: flip ? "translateX(calc(-100% - 14px))" : "translateX(14px)", transition: "transform .22s cubic-bezier(.22,.8,.3,1)" }}>
            <div className="text-[11px] font-bold tracking-wide text-slate-700 dark:text-slate-100 mb-1.5">{label}</div>
            {SERIES.map((s, si) => (
              <div key={s.key} className="flex items-center justify-between text-[11px] leading-5">
                <span className="flex items-center gap-1.5 text-slate-600 dark:text-slate-300">
                  <span className="inline-block w-2 h-2 rounded-full" style={{ background: s.line }} />{s.name}
                </span>
                <span className="font-bold tabular-nums" style={{ color: s.text }}>{vals[si] != null ? `${vals[si]}%` : "—"}</span>
              </div>
            ))}
            <div className="mt-1.5 pt-1.5 border-t border-slate-300/50 dark:border-slate-600/50 flex items-center justify-between text-[11px]">
              <span className="text-slate-500 dark:text-slate-400">Gap</span>
              <span className={`px-1.5 rounded-full font-bold tabular-nums ${gap == null ? "text-slate-400" : gap < 0 ? "bg-rose-500/15 text-rose-600 dark:text-rose-400" : "bg-emerald-500/15 text-emerald-600 dark:text-emerald-400"}`}>
                {gap == null ? "—" : `${gap > 0 ? "+" : ""}${gap}%`}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* =====================================================================
   MASTER CONSTRUCTION SCHEDULE (Revision Tracking)
   - វាយបញ្ចូលដោយដៃគ្រប់ជួរ: Group (PRELIMINARY WORK...) → Item → Sub-item
   - ជួរ UNIT, QUANTITY PLANNING, QUANTITY ACTUAL, DURATION, START, FINISH
   - ក្រាប Gantt បង្ហាញតាម "ខែ" ឬ "ឆ្នាំ"
   - ជួរដែលមានជួរក្រោមវា (Group) គណនាស្វ័យប្រវត្តិ: Start = តូចបំផុត, Finish = ធំបំផុត, % = មធ្យមតាមរយៈពេល
   ===================================================================== */
const MS_DAY = 86400000;
const msParse = (s) => { if (!s) return null; const d = new Date(s + "T00:00:00"); return isNaN(d) ? null : d; };
const msDays = (a, b) => Math.round((b - a) / MS_DAY);
const msFmt = (s) => (s ? s.split("-").reverse().join("/") : "");
const MS_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const msId = () => "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const msRow = (level, name, unit = "", qtyPlan = "", qtyActual = "", start = "", finish = "", boq = "") => ({ id: msId(), level, name, boq, unit, qtyPlan, qtyActual, start, finish });

// ទិន្នន័យគំរូ (អ្នកអាចកែ/លុបទាំងអស់ដោយចុច Edit)
const DEFAULT_MASTER = [
  msRow(0, "PRELIMINARY WORK"),
  msRow(1, "Mobilization & Site Office", "LS", 1, 1, "2026-05-01", "2026-05-15"),
  msRow(1, "Site Clearing & Survey", "m2", 5000, 5000, "2026-05-10", "2026-05-31"),
  msRow(1, "Temporary Facilities", "LS", 1, 1, "2026-05-15", "2026-06-10"),
  msRow(0, "SUB STRUCTURE WORK"),
  msRow(1, "Bore Pile", "m", 1200, 1050, "2026-06-01", "2026-08-15"),
  msRow(1, "Pile Cap & Abutment"),
  msRow(2, "Excavation", "m3", 800, 800, "2026-07-15", "2026-08-10"),
  msRow(2, "Reinforcement", "ton", 120, 90, "2026-08-01", "2026-09-10"),
  msRow(2, "Concrete", "m3", 650, 420, "2026-08-10", "2026-09-30"),
  msRow(0, "SUPER STRUCTURE WORK"),
  msRow(1, "RC Pier", "m3", 480, 430, "2026-08-22", "2026-10-19"),
  msRow(1, "Precast Girder", "nos", 24, 8, "2026-10-01", "2026-11-30"),
  msRow(1, "Deck Slab", "m3", 900, 0, "2026-11-15", "2026-12-15"),
  msRow(1, "Finishing & Road Works", "LS", 1, 0, "2026-12-01", "2026-12-31"),
];
["A1", "A1.1", "A1.2", "A1.3", "B2", "B2.1", "B2.2", "B2.2.1", "B2.2.2", "B2.2.3", "C3", "C3.1", "C3.2", "C3.3", "C3.4"].forEach((c, i) => { DEFAULT_MASTER[i].boq = c; });  // លេខ BOQ គំរូ

// គណនាលេខរៀង, Start/Finish, Duration, % សម្រេច និង % ដែលគួរសម្រេចបាន ត្រឹមថ្ងៃនេះ
function msCompute(items, today) {
  const rows = items.map((r) => ({ ...r, level: Math.max(0, Math.min(2, Number(r.level) || 0)) }));
  const n = rows.length;
  const c = [0, 0, 0];
  rows.forEach((r) => { c[r.level]++; for (let k = r.level + 1; k < 3; k++) c[k] = 0; r.no = c.slice(0, r.level + 1).join("."); });
  rows.forEach((r, i) => { let j = i + 1; while (j < n && rows[j].level > r.level) j++; r.end = j; r.summary = j > i + 1; });
  rows.forEach((r) => {
    const s = msParse(r.start), f = msParse(r.finish);
    const dur = s && f && f >= s ? msDays(s, f) + 1 : null;
    const qp = Number(r.qtyPlan), qa = Number(r.qtyActual);
    const pct = qp > 0 ? Math.max(0, Math.min(100, (qa / qp) * 100)) : 0;
    const exp = dur ? Math.max(0, Math.min(100, ((today - s) / MS_DAY / dur) * 100)) : 0;
    r.info = { s, f, dur, pct, exp, w: dur || 1 };
  });
  rows.forEach((r, i) => {
    if (!r.summary) return;
    let ws = 0, wp = 0, we = 0, s = null, f = null;
    rows.slice(i + 1, r.end).filter((x) => !x.summary).forEach((x) => {
      const o = x.info; ws += o.w; wp += o.w * o.pct; we += o.w * o.exp;
      if (o.s && (!s || o.s < s)) s = o.s;
      if (o.f && (!f || o.f > f)) f = o.f;
    });
    r.info = { s, f, dur: s && f ? msDays(s, f) + 1 : null, pct: ws ? wp / ws : 0, exp: ws ? we / ws : 0, w: ws };
  });
  return rows;
}
const msEnd = (arr, i) => { let j = i + 1; while (j < arr.length && arr[j].level > arr[i].level) j++; return j; };
const r1 = (v) => Math.round(v * 10) / 10;

function MasterSchedule({ items, onSave, canEdit, isKm, t, preparedBy, printMode = false, forceMode = null, printWidth = 0 }) {
  const [modeState, setMode] = useState("month");      // "month" | "year"
  const mode = forceMode || modeState;
  const [printing, setPrinting] = useState(false);
  const [draft, setDraft] = useState(null);        // មិនទទេ = កំពុងកែ
  const editing = draft !== null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const rows = msCompute(editing ? draft : items, today);
  const L = (en, km) => (isKm ? km : en);

  // ---- ប្រតិបត្តិការលើជួរ (ធ្វើលើ draft) ----
  const set = (fn) => setDraft((d) => fn(d.map((r) => ({ ...r }))));
  const upd = (i, k, v) => set((d) => { d[i][k] = v; return d; });
  const addGroup = () => set((d) => [...d, msRow(0, "NEW GROUP")]);
  const addBelow = (i) => set((d) => { const lvl = d[i].level === 0 ? 1 : d[i].level; d.splice(msEnd(d, i), 0, msRow(lvl, "")); return d; });
  const addSub = (i) => set((d) => { if (d[i].level >= 2) return d; d.splice(i + 1, 0, msRow(d[i].level + 1, "")); return d; });
  const del = (i) => set((d) => { const e = msEnd(d, i); if (e - i > 1 && !window.confirm(L("Delete this row and all rows under it?", "លុបជួរនេះ និងជួរទាំងអស់ក្រោមវា?"))) return d; d.splice(i, e - i); return d; });
  const moveUp = (i) => set((d) => {
    let j = i - 1; while (j >= 0 && d[j].level > d[i].level) j--;
    if (j < 0 || d[j].level < d[i].level) return d;
    const e = msEnd(d, i); return [...d.slice(0, j), ...d.slice(i, e), ...d.slice(j, i), ...d.slice(e)];
  });
  const moveDown = (i) => set((d) => {
    const e = msEnd(d, i);
    if (e >= d.length || d[e].level !== d[i].level) return d;
    const e2 = msEnd(d, e); return [...d.slice(0, i), ...d.slice(e, e2), ...d.slice(i, e), ...d.slice(e2)];
  });
  const shift = (i, delta) => set((d) => {
    const e = msEnd(d, i); const blk = d.slice(i, e);
    if (delta > 0 && (i === 0 || blk.some((r) => r.level + 1 > 2))) return d;
    if (delta < 0 && blk.some((r) => r.level - 1 < 0)) return d;
    blk.forEach((r) => { r.level += delta; }); return d;
  });

  // ---- ជួរកាលវិភាគ (Timeline) ----
  const all = rows.map((r) => r.info);
  const starts = all.map((o) => o.s).filter(Boolean), ends = all.map((o) => o.f).filter(Boolean);
  const hasChart = starts.length > 0 && ends.length > 0;
  let rs = null, re = null, ppd = 0, total = 0, segs = [], years = [];
  if (hasChart) {
    const mn = new Date(Math.min(...starts)), mx = new Date(Math.max(...ends));
    ppd = mode === "month" ? 2.4 : 0.8;
    rs = mode === "month" ? new Date(mn.getFullYear(), mn.getMonth(), 1) : new Date(mn.getFullYear(), 0, 1);
    re = mode === "month" ? new Date(mx.getFullYear(), mx.getMonth() + 1, 1) : new Date(mx.getFullYear() + 1, 0, 1);
    if (printMode && printWidth) ppd = Math.max(150, printWidth - 800) / Math.max(1, msDays(rs, re));   // Print: ក្រាបត្រូវទំហំទំព័រ
    total = msDays(rs, re) * ppd;
    const step = mode === "month" ? 1 : 3;
    for (let d = new Date(rs); d < re; d = new Date(d.getFullYear(), d.getMonth() + step, 1)) {
      const nx = new Date(d.getFullYear(), d.getMonth() + step, 1);
      segs.push({ left: msDays(rs, d) * ppd, w: msDays(d, nx) * ppd, year: d.getFullYear(), label: mode === "month" ? MS_MONTHS[d.getMonth()] : "Q" + (d.getMonth() / 3 + 1) });
    }
    segs.forEach((s) => { const y = years.find((x) => x.label === s.year); if (y) y.w += s.w; else years.push({ label: s.year, left: s.left, w: s.w }); });
  }
  const todayX = hasChart && today >= rs && today <= re ? msDays(rs, today) * ppd : null;

  // ---- សង្ខេបរួម (គិតតែជួរស្លឹក ទម្ងន់តាមរយៈពេល) ----
  const leaves = rows.filter((r) => !r.summary);
  const W = leaves.reduce((a, r) => a + r.info.w, 0) || 1;
  const overall = leaves.reduce((a, r) => a + r.info.w * r.info.pct, 0) / W;
  const overallExp = leaves.reduce((a, r) => a + r.info.w * r.info.exp, 0) / W;
  const ovSt = milestoneStatus({ planned: overallExp, actual: overall });

  const head = "py-2 px-2 text-[10px] font-bold uppercase whitespace-nowrap text-slate-600 dark:text-slate-300";
  const cellIn = `${INPUT} !px-1.5 !py-1`;

  return (
    <div className="space-y-4">
      {/* ក្បាល + ប៊ូតុង */}
      {!printMode && (
      <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
        <div>
          <h3 className="text-base font-black uppercase">{L("Master Construction Schedule", "កាលវិភាគសាងសង់មេ (Master Construction Schedule)")}</h3>
          <p className="text-[11px] text-slate-500 dark:text-slate-400">{L("Revision tracking: type each work item manually. Groups calculate automatically.", "តាមដានការកែប្រែ: វាយបញ្ចូលការងារនីមួយៗដោយដៃ។ Group គណនាស្វ័យប្រវត្តិ។")}</p>
        </div>
        <div className="flex flex-wrap items-center gap-2">
          <div className="inline-flex rounded-lg bg-slate-100 dark:bg-slate-800 p-0.5 text-xs font-bold">
            {[["month", L("Month", "តាមខែ")], ["year", L("Year", "តាមឆ្នាំ")]].map(([k, lb]) => (
              <button key={k} onClick={() => setMode(k)} className={`px-3 py-1 rounded-md ${mode === k ? "bg-white dark:bg-slate-600 shadow text-blue-600 dark:text-white" : "text-slate-500"}`}>{lb}</button>
            ))}
          </div>
          {!editing && <button onClick={() => setPrinting(true)} className="px-3 py-1.5 rounded-md border border-inherit text-xs font-bold flex items-center gap-1.5"><Icon name="Printer" size={13} />{L("Print", "បោះពុម្ព")}</button>}
          {canEdit && !editing && <button onClick={() => setDraft(items.map((r) => ({ ...r })))} className="px-3 py-1.5 rounded-md bg-blue-600 text-white text-xs font-bold">✎ {L("Edit schedule", "កែកាលវិភាគ")}</button>}
          {editing && (<>
            <button onClick={addGroup} className="px-3 py-1.5 rounded-md border border-inherit text-xs font-bold text-blue-600">＋ {L("Add group", "បន្ថែម Group")}</button>
            <button onClick={() => setDraft(null)} className="px-3 py-1.5 rounded-md border border-inherit text-xs">{L("Cancel", "បោះបង់")}</button>
            <button onClick={() => { onSave(draft); setDraft(null); }} className="px-4 py-1.5 rounded-md bg-emerald-600 text-white text-xs font-bold">✓ {L("Save", "រក្សាទុក")}</button>
          </>)}
        </div>
      </div>

      )}

      {/* សង្ខេបរួម + ពន្យល់ពណ៌ */}
      <div className={`grid ${printMode ? "grid-cols-3" : "grid-cols-1 md:grid-cols-3"} gap-3`}>
        <div className={`${printMode ? "col-span-2" : "md:col-span-2"} p-3 rounded-xl border border-slate-200/80 dark:border-[#222] bg-slate-50/60 dark:bg-slate-900/50 space-y-2`}>
          <div className="flex justify-between items-end text-xs">
            <span className="font-bold uppercase">{L("Overall progress (by quantity)", "វឌ្ឍនភាពរួម (តាមបរិមាណ)")}</span>
            <span className="font-black text-lg tabular-nums" style={{ color: ovSt.colors[0] }}>{r1(overall)}%</span>
          </div>
          <GradientBar percent={overall} colors={ovSt.colors} height="h-3" marker={overallExp} />
          <div className="flex justify-between text-[10px] text-slate-500 dark:text-slate-400">
            <span>▎{L("Should be by today", "គួរសម្រេចបានត្រឹមថ្ងៃនេះ")}: {r1(overallExp)}%</span>
            <span className={`px-1.5 rounded-full font-bold ${ovSt.chip}`}>{ovSt.label}</span>
          </div>
        </div>
        <div className="p-3 rounded-xl border border-slate-200/80 dark:border-[#222] bg-slate-50/60 dark:bg-slate-900/50 text-[11px] space-y-1.5">
          <div className="flex items-center gap-2"><span className="inline-block w-6 h-3 rounded-sm bg-blue-200 dark:bg-blue-900/60 border border-blue-300" />{L("Planned duration", "រយៈពេលផែនការ")}</div>
          <div className="flex items-center gap-2"><span className="inline-block w-6 h-3 rounded-sm" style={{ background: "linear-gradient(90deg,#059669,#34D399)" }} />{L("Actual progress (green / amber / red = on track / slight / delayed)", "វឌ្ឍនភាពជាក់ស្តែង (បៃតង / លឿង / ក្រហម)")}</div>
          <div className="flex items-center gap-2"><span className="inline-block w-6 h-0.5 bg-rose-500" />{L("Today", "ថ្ងៃនេះ")}</div>
        </div>
      </div>

      {/* តារាង + Gantt */}
      <div className={`${printMode ? "" : "overflow-x-auto"} rounded-lg border border-slate-200 dark:border-[#222]`}>
        <table className={`border-collapse ${printMode ? "text-[10px]" : "text-xs"}`} style={{ minWidth: "100%" }}>
          <thead>
            <tr className="bg-slate-100 dark:bg-slate-900 border-b border-slate-200 dark:border-[#222] text-left">
              <th className={`${head} ${printMode ? "" : "sticky left-0 z-20"} bg-slate-100 dark:bg-slate-900 min-w-[230px]`}>{L("No. / Description of work", "លេខ / ឈ្មោះការងារ")}</th>
              <th className={head}>BOQ</th>
              <th className={head}>{L("Unit", "ឯកតា")}</th>
              <th className={`${head} text-right`}>{L("Qty planning", "បរិមាណផែនការ")}</th>
              <th className={`${head} text-right`}>{L("Qty actual", "បរិមាណជាក់ស្តែង")}</th>
              <th className={`${head} text-right`}>{L("Duration", "រយៈពេល")}</th>
              <th className={head}>{L("Start", "ចាប់ផ្តើម")}</th>
              <th className={head}>{L("Finish", "បញ្ចប់")}</th>
              <th className={`${head} text-right`}>%</th>
              {editing && <th className={head}>{L("Row", "ជួរ")}</th>}
              <th className="p-0 align-top" style={{ minWidth: hasChart ? total + 44 : 120 }}>
                {hasChart ? (
                  <div className="relative" style={{ height: 48, width: total + 44 }}>
                    {years.map((y) => <div key={y.label} className="absolute top-0 h-6 flex items-center justify-center text-[10px] font-black border-l border-slate-300 dark:border-slate-700 bg-slate-200/60 dark:bg-slate-800" style={{ left: y.left, width: y.w }}>{y.label}</div>)}
                    {segs.map((s, k) => <div key={k} className="absolute top-6 h-6 flex items-center justify-center text-[9px] font-bold font-mono border-l border-slate-300 dark:border-slate-700 text-slate-500 dark:text-slate-400" style={{ left: s.left, width: s.w }}>{s.label}</div>)}
                  </div>
                ) : <div className="px-2 text-[10px] text-slate-400 normal-case">{L("Add Start & Finish dates to see the chart", "បញ្ចូលថ្ងៃ Start/Finish ដើម្បីមើលក្រាប")}</div>}
              </th>
            </tr>
          </thead>
          <tbody>
            {rows.length === 0 && <tr><td colSpan={11} className="p-6 text-center text-slate-500">{L("No items yet. Click Edit schedule → Add group.", "មិនទាន់មានការងារ។ ចុច កែកាលវិភាគ → បន្ថែម Group។")}</td></tr>}
            {rows.map((r, i) => {
              const o = r.info, st = milestoneStatus({ planned: o.exp, actual: o.pct });
              const isG = r.level === 0;
              const rowBg = isG ? "bg-slate-100/80 dark:bg-slate-900" : r.summary ? "bg-slate-50 dark:bg-[#121212]" : "bg-white dark:bg-[#0F0F0F]";
              const bar = o.s && o.f ? { left: msDays(rs, o.s) * ppd, w: Math.max(4, o.dur * ppd) } : null;
              return (
                <tr key={r.id} className={`border-b border-slate-100 dark:border-[#1d1d1d] ${rowBg} ${isG ? "font-bold" : ""}`}>
                  <td className={`py-1.5 px-2 ${printMode ? "" : "sticky left-0 z-10"} ${rowBg} border-r border-slate-100 dark:border-[#1d1d1d]`} style={{ paddingLeft: 8 + r.level * 14 }}>
                    <div className="flex items-center gap-1.5">
                      <span className="font-mono text-[10px] text-slate-400 shrink-0 w-8">{r.no}</span>

                        {bar && (<>

          </tbody>
        </table>
      </div>
      {editing && <p className="text-[11px] text-slate-500 dark:text-slate-400">{L("Tip: % = Qty actual ÷ Qty planning. Rows with sub-rows (groups) are calculated automatically. ▲▼ move, ⇤⇥ change level, ＋ add row, ↳ add sub-item.", "ណែនាំ: % = បរិមាណជាក់ស្តែង ÷ បរិមាណផែនការ។ ជួរដែលមានជួរតូចក្រោម (Group) គណនាស្វ័យប្រវត្តិ។ ▲▼ ផ្លាស់ទី, ⇤⇥ ប្តូរកម្រិត, ＋ បន្ថែមជួរ, ↳ បន្ថែមការងារតូច។")}</p>}

  );
}

/* =====================================================================
   ZOOM ពេញអេក្រង់ (ក្រាប S-Curve): ទូរស័ព្ទអាច "Rotate" ឲ្យពេញអេក្រង់ផ្ដេក
   ===================================================================== */
function ZoomModal({ title, onClose, isKm, right, children }) {
  const [rot, setRot] = useState(false);
  const [vp, setVp] = useState({ w: window.innerWidth, h: window.innerHeight });
  useEffect(() => {
    const f = () => setVp({ w: window.innerWidth, h: window.innerHeight });
    const esc = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("resize", f); window.addEventListener("orientationchange", f); window.addEventListener("keydown", esc);
    return () => {
      window.removeEventListener("resize", f); window.removeEventListener("orientationchange", f); window.removeEventListener("keydown", esc);
      try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
      try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
    };
  }, []);
  const portrait = vp.h > vp.w;
  const rotated = rot && portrait;                       // បង្វិល 90° ដោយ CSS (ពេលទូរស័ព្ទមិនអាច lock orientation)
  const W = rotated ? vp.h : vp.w, H = rotated ? vp.w : vp.h;
  const chartW = Math.max(240, Math.min(W - 24, (H - 52 - 28) * 2));   // ក្រាបមានសមាមាត្រ 2:1
  const toggle = async () => {
    if (rot) { setRot(false); return; }
    try { await document.documentElement.requestFullscreen(); await screen.orientation.lock("landscape"); }   // វិធីល្អបំផុត (Android Chrome)
    catch (e) { try { if (document.fullscreenElement) await document.exitFullscreen(); } catch (e2) {} setRot(true); } // iPhone: បង្វិលដោយ CSS
  };
  const box = rotated
    ? { position: "fixed", top: 0, left: 0, width: vp.h, height: vp.w, transformOrigin: "top left", transform: "rotate(90deg) translateY(-100%)" }
    : { position: "fixed", inset: 0 };
  return ReactDOM.createPortal(
    <div className="z-[60] bg-white dark:bg-[#0F0F0F] text-slate-900 dark:text-slate-100 flex flex-col" style={box}>
      <div className="flex items-center justify-between gap-2 px-3 shrink-0 border-b border-slate-200 dark:border-[#222]" style={{ height: 52 }}>
        <div className="font-bold uppercase text-sm text-blue-600 truncate">{title}</div>
        <div className="flex items-center gap-2">
          {right}
          {vp.w < 1024 && (
            <button onClick={toggle} className="px-2.5 py-1.5 rounded-md border border-slate-300 dark:border-[#333] text-xs font-bold flex items-center gap-1.5">
              <Icon name="RotateCw" size={14} />{rotated ? (isKm ? "ត្រឡប់" : "Back") : (isKm ? "បង្វិលពេញអេក្រង់" : "Rotate")}
            </button>
          )}
          <button onClick={onClose} className="p-1.5 rounded-md border border-slate-300 dark:border-[#333]" title="Close"><Icon name="X" /></button>
        </div>
      </div>
      <div className="flex-1 min-h-0 flex items-center justify-center p-3 overflow-auto">{children(chartW, rotated)}</div>
    </div>, document.body);
}

/* =====================================================================
   REAL SITE PHOTO & DRONE INSPECTION
   - រូបភាពមាន Caption + Link Share (OneDrive / Telegram / Google Drive) មិនចាំបាច់ Upload រូបធំ
   - រូប Preview (ស្រេចចិត្ត) ត្រូវបង្រួមតូចស្វ័យប្រវត្តិ; អតិបរមា 15
   ===================================================================== */
const MAX_PHOTOS = 15;
const normLink = (s) => { s = (s || "").trim(); if (!s) return ""; return /^https?:\/\//i.test(s) ? s : "https://" + s; };
const linkKind = (u) => (!u ? "" : /1drv\.ms|onedrive\.live\.com|sharepoint\.com/i.test(u) ? "OneDrive" : /t\.me|telegram\./i.test(u) ? "Telegram" : /drive\.google|docs\.google|photos\.app|photos\.google/i.test(u) ? "Google Drive" : "Link");
const KIND_COLORS = { OneDrive: ["#0369A1", "#38BDF8"], Telegram: ["#1D8FD1", "#38B6F0"], "Google Drive": ["#15803D", "#FACC15"], Link: ["#475569", "#94A3B8"] };

function LinkTile({ kind = "Link", small = false }) {
  const c = KIND_COLORS[kind] || KIND_COLORS.Link;
  return (
    <div className="w-full h-full flex flex-col items-center justify-center gap-1 text-white" style={{ background: `linear-gradient(135deg, ${c[0]}, ${c[1]})` }}>
      <Icon name="LinkIcon" size={small ? 16 : 34} />
      <div className={`${small ? "text-[8px]" : "text-sm"} font-black tracking-wide`}>{kind}</div>
    </div>
  );
}

function DroneGallery({ images, title, canEdit, onChange, isKm }) {
  const [index, setIndex] = useState(0);
  const [playing, setPlaying] = useState(true);
  const [manage, setManage] = useState(false);
  useEffect(() => {
    if (!playing || images.length < 2) return;
    const timer = setInterval(() => setIndex((i) => (i + 1) % images.length), 4000);
    return () => clearInterval(timer);
  }, [playing, images.length]);
  const idx = images.length ? index % images.length : 0;
  const current = images[idx];
  const kind = current ? linkKind(current.link) : "";
  const btn = "p-1 rounded border border-inherit hover:bg-slate-200 dark:hover:bg-slate-800";
  return (
    <div>
      <CardTitle icon="Image" right={
        <div className="flex items-center gap-1">
          {canEdit && <button onClick={() => setManage(true)} className="px-2 py-0.5 rounded bg-emerald-600 text-white text-[10px] font-bold">✎ {isKm ? "គ្រប់គ្រង" : "Manage"} {images.length}/{MAX_PHOTOS}</button>}
          <button className={btn} onClick={() => setIndex((idx - 1 + images.length) % Math.max(1, images.length))}><Icon name="ChevronLeft" size={14} /></button>
          <button className={btn} onClick={() => setIndex((idx + 1) % Math.max(1, images.length))}><Icon name="ChevronRight" size={14} /></button>
          <button className={btn} onClick={() => setPlaying(!playing)}><Icon name={playing ? "Pause" : "Play"} size={14} /></button>
        </div>
      }>{title}</CardTitle>
      {current ? (
        <>
          <div className="relative rounded-md overflow-hidden aspect-video border border-inherit">
            {current.url ? <img src={current.url} alt={current.caption || "Site photo"} className="w-full h-full object-cover" /> : <LinkTile kind={kind || "Link"} />}
            {current.link && (
              <a href={current.link} target="_blank" rel="noopener noreferrer"
                className="absolute top-2 right-2 px-2.5 py-1 rounded-full bg-black/60 hover:bg-black/80 text-white text-[10px] font-bold backdrop-blur flex items-center gap-1">
                ↗ {isKm ? "បើករូបពេញ" : "Open"} · {kind}
              </a>
            )}
            <div className="absolute bottom-0 inset-x-0 px-3 pt-10 pb-2.5 bg-gradient-to-t from-black/65 via-black/25 to-transparent text-white text-[12px] font-bold flex items-end justify-between gap-2 pointer-events-none">
              <span className="truncate" style={{ textShadow: "0 1px 4px rgba(0,0,0,.85)" }}>{current.caption}</span>
              <span className="shrink-0 font-mono text-[10px] px-2 py-0.5 rounded-full bg-white/20 backdrop-blur-md border border-white/30 text-white">{idx + 1} / {images.length}</span>
            </div>
          </div>
          <div className="flex flex-wrap justify-center gap-1 mt-2">
            {images.map((_, i) => <button key={i} onClick={() => setIndex(i)} className={`h-1.5 rounded-full transition-all ${i === idx ? "w-5 bg-blue-600" : "w-1.5 bg-slate-300 dark:bg-slate-700"}`} />)}
          </div>
        </>
      ) : <div className="text-xs text-slate-500 py-6 text-center">{isKm ? "មិនទាន់មានរូបថត។" : "No photos yet."}</div>}
      {manage && <PhotoManager images={images} isKm={isKm} onClose={() => setManage(false)} onSave={(list) => { onChange(list); setIndex(0); setManage(false); }} />}
    </div>
  );
}

function PhotoManager({ images, onSave, onClose, isKm }) {
  const L = (en, km) => (isKm ? km : en);
  const [list, setList] = useState(images.map((p) => ({ ...p })));
  const upd = (i, k, v) => setList(list.map((p, j) => (j === i ? { ...p, [k]: v } : p)));
  const move = (i, d) => { const j = i + d; if (j < 0 || j >= list.length) return; const a = [...list]; [a[i], a[j]] = [a[j], a[i]]; setList(a); };
  const pick = async (i, file) => { if (!file) return; upd(i, "url", await cropImage(file, 640, 360, 0.7)); };   // បង្រួម Preview ≈ 40KB
  const save = () => onSave(list.map((p) => ({ ...p, link: normLink(p.link), caption: (p.caption || "").trim() })).filter((p) => p.url || p.link || p.caption));
  return (
    <Modal title={L("Real Site Photo & Drone Inspection", "រូបថតការដ្ឋាន និងដ្រូន")} onClose={onClose} width="max-w-3xl">
      <div className="p-2.5 rounded-lg bg-sky-500/10 border border-sky-500/30 text-[11px] text-sky-800 dark:text-sky-200 leading-relaxed">
        {L("Big photos / videos: upload to OneDrive or a Telegram group, then paste the share link here. A small preview photo is optional (auto-compressed).",
           "រូបថត/វីដេអូធំ៖ Upload ទៅ OneDrive ឬ Group Telegram រួចបិទភ្ជាប់ Link Share នៅទីនេះ។ រូប Preview តូចគឺស្រេចចិត្ត (បង្រួមស្វ័យប្រវត្តិ)។")}
      </div>
      <div className="space-y-3">
        {list.map((p, i) => {
          const kind = linkKind(normLink(p.link));
          return (
            <div key={i} className="p-3 rounded-xl border border-slate-200 dark:border-[#222] bg-slate-50/70 dark:bg-slate-900/40 grid grid-cols-1 sm:grid-cols-[110px_1fr] gap-3">
              <div className="aspect-video sm:aspect-[16/10] rounded-md overflow-hidden border border-inherit bg-slate-200 dark:bg-slate-800 relative">
                {p.url ? <img src={p.url} alt="" className="w-full h-full object-cover" /> : <LinkTile kind={kind || "Link"} small />}
              </div>
              <div className="space-y-2 min-w-0">
                <input value={p.caption || ""} placeholder={L("Caption (what is in this photo?)", "Caption (ពិពណ៌នារូបថត)")} className={INPUT} onChange={(e) => upd(i, "caption", e.target.value)} />
                <input value={p.link || ""} placeholder={L("Share link: OneDrive / Telegram / Google Drive", "Link Share: OneDrive / Telegram / Google Drive")} className={`${INPUT} font-mono`} onChange={(e) => upd(i, "link", e.target.value)} />
                <div className="flex flex-wrap items-center gap-2">
                  <label className="px-2.5 py-1 rounded border border-inherit font-bold cursor-pointer hover:bg-slate-200 dark:hover:bg-slate-800">
                    📷 {p.url ? L("Change preview", "ប្តូររូប Preview") : L("Preview photo (optional)", "រូប Preview (ស្រេចចិត្ត)")}
                    <input type="file" accept="image/*" hidden onChange={(e) => { pick(i, e.target.files[0]); e.target.value = ""; }} />
                  </label>
                  {p.url && <button type="button" onClick={() => upd(i, "url", "")} className="px-2 py-1 rounded border border-inherit text-slate-500">{L("Remove preview", "លុប Preview")}</button>}
                  {kind && <span className="px-2 py-0.5 rounded-full text-white text-[10px] font-bold" style={{ background: KIND_COLORS[kind][0] }}>{kind}</span>}
                  <span className="flex-1" />
                  <button type="button" onClick={() => move(i, -1)} className="px-1.5 hover:text-blue-600">▲</button>
                  <button type="button" onClick={() => move(i, 1)} className="px-1.5 hover:text-blue-600">▼</button>
                  <button type="button" onClick={() => setList(list.filter((_, j) => j !== i))} className="px-1.5 text-rose-600"><Icon name="Trash2" size={14} /></button>
                </div>
              </div>
            </div>
          );
        })}
      </div>
      <div className="flex items-center justify-between pt-3 border-t border-inherit gap-2 flex-wrap">
        <button type="button" disabled={list.length >= MAX_PHOTOS} onClick={() => setList([...list, { url: "", caption: "", link: "" }])}
          className="px-3 py-1.5 rounded border border-inherit font-bold text-blue-600 disabled:opacity-40">＋ {L("Add photo", "បន្ថែមរូប")} ({list.length}/{MAX_PHOTOS})</button>
        <div className="flex gap-2">
          <button type="button" onClick={onClose} className="px-3 py-1.5 rounded border border-inherit">{L("Cancel", "បោះបង់")}</button>
          <button type="button" onClick={save} className="px-4 py-1.5 rounded bg-blue-600 text-white font-bold">{L("Save", "រក្សាទុក")}</button>
        </div>
      </div>
    </Modal>
  );
}

/* =====================================================================
   PRINT / PDF: Daily Report និង Master Schedule (A4 / A3, បញ្ឈរ / ផ្ដេក)
   - បើក Preview → ជ្រើសទំហំ → ចុច Print → ជ្រើស "Save as PDF" ដើម្បីបាន File PDF
   ===================================================================== */
function useWeather() {
  const [w, setW] = useState(null);
  useEffect(() => {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LOC.lat}&longitude=${LOC.lon}`
      + "&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code"
      + "&hourly=temperature_2m,weather_code,relative_humidity_2m,wind_speed_10m"
      + "&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FPhnom_Penh&forecast_days=6";
    fetch(url).then((r) => r.json()).then(setW).catch(() => setW({ error: true }));
  }, []);
  return w;
}

const RPT_CSS = `
@media print {
  html, body { background:#fff !important; height:auto !important; overflow:visible !important; }
  body.report-open #root { display:none !important; }
  body.report-open #report-overlay { position:static !important; inset:auto !important; overflow:visible !important; background:#fff !important; }
  .no-print { display:none !important; }
  .report-fit { zoom:1 !important; margin:0 !important; }
  .report-page { box-shadow:none !important; }
}
.report-page, .report-page * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.avoid-break { break-inside:avoid; page-break-inside:avoid; }
`;

function ReportHeader({ t, title, date, preparedBy }) {
  const d = new Date(date + "T00:00:00");
  const dateStr = isNaN(d) ? date : d.toLocaleDateString("en-GB", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
  return (
    <div className="avoid-break flex items-start justify-between gap-4 pb-3 mb-3 border-b-4" style={{ borderColor: "#3B5BDB" }}>
      <div>
        <div className="text-[22px] font-black tracking-wide" style={{ color: "#1B2A4E" }}>T.I.A CONSTRUCTION</div>
        <div className="text-[12px] font-bold text-slate-700 mt-0.5">{t.projectName}</div>
        <div className="text-[10px] text-slate-500">{PROJECT_ADDRESS}</div>
      </div>
      <div className="text-right shrink-0">
        <div className="text-[16px] font-black uppercase" style={{ color: "#3B5BDB" }}>{title}</div>
        <div className="text-[11px] font-bold text-slate-700 mt-1">Date: {dateStr}</div>
        {preparedBy && <div className="text-[10px] text-slate-500">Prepared by: {preparedBy}</div>}
      </div>
    </div>
  );
}

function PrintModal({ title, onClose, t, isKm, defaultOrientation = "portrait", preparedBy, extra, children }) {
  const [size, setSize] = useState("A4");
  const [orient, setOrient] = useState(defaultOrientation);
  const [date, setDate] = useState(() => new Date().toISOString().slice(0, 10));
  const [vw, setVw] = useState(window.innerWidth);
  useEffect(() => {
    const f = () => setVw(window.innerWidth);
    window.addEventListener("resize", f);
    const html = document.documentElement, wasDark = html.classList.contains("dark");
    html.classList.remove("dark");                      // Report ត្រូវតែផ្ទៃសជានិច្ច (Night Mode មិនប៉ះពាល់)
    document.body.classList.add("report-open");
    return () => { window.removeEventListener("resize", f); document.body.classList.remove("report-open"); if (wasDark) html.classList.add("dark"); };
  }, []);
  const logical = orient === "portrait" ? 730 : 1058;   // ទទឹងមាតិកា (A4 ដកគែម 8mm); A3 = A4 ពង្រីក ×1.414
  const zf = size === "A3" ? 1.4142 : 1;
  const fit = Math.min(1, (vw - 16) / (logical * zf));  // បង្រួមតែលើអេក្រង់ (ពេល Print មិនប៉ះពាល់)
  const seg = (cur, set, opts) => (
    <div className="inline-flex rounded-md bg-slate-100 p-0.5 font-bold">
      {opts.map(([k, lb]) => <button key={k} onClick={() => set(k)} className={`px-2.5 py-1 rounded ${cur === k ? "bg-white shadow text-blue-600" : "text-slate-500"}`}>{lb}</button>)}
    </div>
  );
  return ReactDOM.createPortal(
    <div id="report-overlay" className="fixed inset-0 z-[70] bg-slate-300 overflow-auto text-slate-900">
      <style>{`@page { size: ${size} ${orient}; margin: 8mm; }${RPT_CSS}`}</style>
      <div className="no-print sticky top-0 z-10 bg-white border-b border-slate-300 px-3 py-2 flex flex-wrap items-center gap-2 text-xs">
        <div className="font-black uppercase text-blue-700 mr-1">{title}</div>
        {seg(size, setSize, [["A4", "A4"], ["A3", "A3"]])}
        {seg(orient, setOrient, [["portrait", isKm ? "បញ្ឈរ" : "Portrait"], ["landscape", isKm ? "ផ្ដេក" : "Landscape"]])}
        <label className="flex items-center gap-1 font-bold text-slate-600">{isKm ? "ថ្ងៃ" : "Date"}
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="border border-slate-300 rounded px-1.5 py-1 font-normal" />
        </label>
        {extra}
        <span className="flex-1" />
        <button onClick={() => window.print()} className="px-4 py-1.5 rounded-md bg-blue-600 text-white font-bold flex items-center gap-1.5"><Icon name="Printer" size={14} />{isKm ? "Print / រក្សាទុក PDF" : "Print / Save as PDF"}</button>
        <button onClick={onClose} className="px-3 py-1.5 rounded-md border border-slate-300 font-bold">{isKm ? "បិទ" : "Close"}</button>
        <div className="basis-full text-[10px] text-slate-500">{isKm ? "ក្នុងផ្ទាំង Print ជ្រើស Destination = \"Save as PDF\" ដើម្បីបាន File PDF។" : "In the print dialog choose Destination = \"Save as PDF\" to get a PDF file."}</div>
      </div>
      <div className="report-fit mx-auto my-3" style={{ zoom: fit, width: logical * zf }}>
        <div className="report-page bg-white shadow-xl" style={{ width: logical, zoom: zf }}>
          <ReportHeader t={t} title={title} date={date} preparedBy={preparedBy} />
          {children({ logical, date, size, orient })}
          <div className="mt-4 pt-2 border-t border-slate-300 text-[9px] text-slate-400 flex justify-between"><span>T.I.A Document Hub</span><span>{PROJECT_ADDRESS}</span></div>
        </div>
      </div>
    </div>, document.body);
}

// ប្រអប់ផ្នែកក្នុង Report
function RSec({ title, children, className = "" }) {
  return (
    <div className={`avoid-break rounded-lg border border-slate-300 p-3 ${className}`}>
      <div className="text-[10px] font-black uppercase tracking-wide mb-2" style={{ color: "#1B2A4E" }}>{title}</div>
      {children}
    </div>
  );
}
const RTable = ({ head, rows, align = [] }) => (
  <table className="w-full text-[10px] border-collapse">
    <thead><tr className="bg-slate-100 text-slate-600 uppercase text-[9px]">{head.map((h, i) => <th key={i} className={`py-1 px-1.5 border border-slate-200 ${align[i] === "r" ? "text-right" : "text-left"}`}>{h}</th>)}</tr></thead>
    <tbody>{rows.map((r, i) => <tr key={i} className="avoid-break">{r.map((c, j) => <td key={j} className={`py-1 px-1.5 border border-slate-200 ${align[j] === "r" ? "text-right tabular-nums" : ""}`}>{c}</td>)}</tr>)}</tbody>
  </table>
);

function DailyReport({ r, ctx }) {
  const { t, isKm, completePct, completeMonth, daysElapsed, totalDays, remainingDays, dates, trackerCount, sCurve, data, photos } = r;
  const weather = useWeather();
  const cur = weather && weather.current;
  const daily = weather && weather.daily;
  const sum = (arr, k) => arr.reduce((a, x) => a + Number(x[k] || 0), 0);
  const cols = ctx.orient === "portrait" ? 3 : 4;
  const trackers = [["RFI", PALETTE.blue], ["RFA", PALETTE.emerald], ["SI", PALETTE.amber], ["NCR", PALETTE.rose]];
  return (
    <div className="space-y-3">
      <div className="grid grid-cols-3 gap-3">
        <RSec title={t.overallProject}>
          <div className="flex items-center justify-between gap-2">
            <div>
              <div className="text-2xl font-black tabular-nums">{completePct}%</div>
              {completeMonth && <div className="text-[9px] font-mono text-slate-500">as of {completeMonth}</div>}
              <div className="text-[9px] mt-1 text-slate-600">{t.remaining}: {r1(100 - completePct)}%</div>
            </div>
            <RingProgress pct={completePct} />
          </div>
        </RSec>
        <RSec title={t.dayElapsed}>
          <div className="text-lg font-black tabular-nums">{daysElapsed} / {totalDays} <span className="text-[10px] font-normal text-slate-500">Days</span></div>
          <div className="my-2"><GradientBar percent={(daysElapsed / totalDays) * 100} colors={PALETTE.amber} height="h-2.5" marker={completePct} /></div>
          <div className="text-[9px] text-slate-600 flex justify-between"><span>{dates.startDate}</span><span>{t.remainingDays}: {remainingDays}</span><span>{dates.endDate}</span></div>
        </RSec>
        <RSec title={`${t.rfiRfaSiNcrSummary}`}>
          <div className="grid grid-cols-4 gap-1.5 text-center">
            {trackers.map(([k, pal]) => (
              <div key={k} className="rounded border border-slate-200 py-1.5" style={{ background: `${pal[0]}14` }}>
                <div className="text-[9px] font-black" style={{ color: pal[0] }}>{k}</div>
                <div className="text-xl font-black tabular-nums" style={{ color: pal[0] }}>{trackerCount(k)}</div>
              </div>
            ))}
          </div>
        </RSec>
      </div>

      <RSec title={t.sCurveTitle}>
        <SCurveChart data={sCurve} width={ctx.logical - 26} />
        <div className="mt-2 overflow-hidden">
          <RTable head={["", ...sCurve.map((d) => d.month)]} align={["l", ...sCurve.map(() => "r")]}
            rows={[["Planned %", ...sCurve.map((d) => d.planned)], ["Actual %", ...sCurve.map((d) => (Number(d.actual) > 0 ? d.actual : "—"))],
                   ["Gap %", ...sCurve.map((d) => (Number(d.actual) > 0 ? r1(Number(d.actual) - Number(d.planned)) : "—"))]]} />
        </div>
      </RSec>

      <div className="grid grid-cols-2 gap-3">
        {[["machinery", t.machineryTitle], ["manpower", t.manpowerTitle]].map(([k, ttl]) => (
          <RSec key={k} title={ttl}>
            <RTable head={["#", isKm ? "ឈ្មោះ" : "Name", "Qty"]} align={["l", "l", "r"]}
              rows={[...data[k].map((x, i) => [i + 1, x.name, x.qty]), [<b key="t"></b>, <b key="tt">TOTAL</b>, <b key="tq">{sum(data[k], "qty")}</b>]]} />
          </RSec>
        ))}
      </div>

      <RSec title={t.weeklyPerformance}>
        <RTable head={["Week", "Date range", "Workers (persons)", "Machinery (units)"]} align={["l", "l", "r", "r"]}
          rows={data.weekly.map((w) => [w.week, w.dateRange, w.worker, w.machinery])} />
      </RSec>

      <RSec title={t.masterScheduleTitle}>
        <RTable head={["#", "Description", "Start", "Finish", "Plan %", "Actual %", "Status"]} align={["l", "l", "l", "l", "r", "r", "l"]}
          rows={data.milestones.map((m, i) => { const st = milestoneStatus(m); return [i + 1, m.title, m.startDate, m.endDate, m.planned, m.actual, <span key="s" style={{ color: st.colors[0], fontWeight: 700 }}>{st.label}</span>]; })} />
      </RSec>

      <RSec title={isKm ? "ទីតាំងគម្រោង និងអាកាសធាតុ" : "Project Location & Weather"}>
        <div className="grid grid-cols-2 gap-3 text-[10px]">
          <div>
            <div className="font-bold text-[11px]">{PROJECT_ADDRESS}</div>
            <div className="text-slate-600 mt-1">GPS: {LOC.lat}, {LOC.lon}</div>
            <div className="text-slate-500 break-all">https://maps.google.com/?q={LOC.lat},{LOC.lon}</div>
          </div>
          <div>
            {cur ? (
              <>
                <div className="font-bold text-[11px]">{WX(cur.weather_code)} {Math.round(cur.temperature_2m)}°C · {isKm ? "សំណើម" : "Humidity"} {cur.relative_humidity_2m}% · {isKm ? "ខ្យល់" : "Wind"} {Math.round(cur.wind_speed_10m)} km/h</div>
                {daily && <div className="flex gap-1.5 mt-1.5">{daily.time.slice(0, 5).map((d, i) => (
                  <div key={d} className="flex-1 text-center rounded border border-slate-200 py-0.5">
                    <div className="text-[8px] text-slate-500">{d.slice(5)}</div><div>{WX(daily.weather_code[i])}</div>
                    <div className="text-[8px] font-bold">{Math.round(daily.temperature_2m_max[i])}°/{Math.round(daily.temperature_2m_min[i])}°</div>
                  </div>))}</div>}
              </>
            ) : <div className="text-slate-500">{weather && weather.error ? (isKm ? "មិនអាចទាញអាកាសធាតុ" : "Weather unavailable") : "…"}</div>}
          </div>
        </div>
      </RSec>

      <RSec title={t.droneGalleryTitle}>
        {photos.length === 0 ? <div className="text-[10px] text-slate-500">—</div> : (
          <div className="grid gap-2" style={{ gridTemplateColumns: `repeat(${cols}, minmax(0, 1fr))` }}>
            {photos.map((p, i) => {
              const kind = linkKind(p.link);
              return (
                <div key={i} className="avoid-break">
                  <div className="aspect-video rounded border border-slate-300 overflow-hidden bg-slate-100">{p.url ? <img src={p.url} alt="" className="w-full h-full object-cover" /> : <LinkTile kind={kind || "Link"} small />}</div>
                  <div className="text-[9px] mt-0.5 leading-tight font-semibold">{i + 1}. {p.caption}</div>
                  {p.link && <div className="text-[7.5px] text-slate-500 break-all leading-tight">{kind}: {p.link}</div>}
                </div>
              );
            })}
          </div>
        )}
      </RSec>

      <div className="avoid-break grid grid-cols-3 gap-6 pt-6 text-[10px] text-center text-slate-600">
        {["Prepared by", "Checked by", "Approved by"].map((s) => <div key={s}><div className="border-t border-slate-500 pt-1 mt-8">{s}</div></div>)}
      </div>
    </div>
  );
}

/* =====================================================================
   LEAVE RECORD & TO-DO LIST: ប្រតិទិន (Calendar) តាមដានច្បាប់ឈប់សម្រាករបស់បុគ្គលិក, To-do និងកំណត់ចំណាំ
   ===================================================================== */
const isoOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const todayISO = () => isoOf(new Date());
const addDaysISO = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return isoOf(d); };
const dmy = (s) => (s ? s.split("-").reverse().join("/") : "");

const CAL_TYPES = {
  leave: { en: "Leave", km: "ច្បាប់ឈប់សម្រាក", dot: "#F59E0B", chip: "bg-amber-500/15 text-amber-800 dark:text-amber-200 border-amber-500/40" },
  todo:  { en: "To-do", km: "ការងារត្រូវធ្វើ", dot: "#3B5BDB", chip: "bg-blue-500/15 text-blue-800 dark:text-blue-200 border-blue-500/40" },
  note:  { en: "Note", km: "កំណត់ចំណាំ", dot: "#8B5CF6", chip: "bg-violet-500/15 text-violet-800 dark:text-violet-200 border-violet-500/40" },
};
const LEAVE_KINDS = ["Annual leave", "Sick leave", "Special leave", "Unpaid leave", "Mission / Off-site", "Other"];
const DEFAULT_CAL = [
  { id: "c1", type: "todo", title: "Submit weekly progress report", staff: "", leaveKind: "", start: addDaysISO(1), end: addDaysISO(1), priority: "High", done: false, note: "" },
  { id: "c2", type: "leave", title: "", staff: "Eng. Sokha", leaveKind: "Annual leave", start: addDaysISO(3), end: addDaysISO(5), priority: "", done: false, note: "" },
  { id: "c3", type: "note", title: "Concrete pour at Pier P2 — coordinate with batching plant", staff: "", leaveKind: "", start: addDaysISO(2), end: addDaysISO(2), priority: "", done: false, note: "" },
];

function LeaveCalendar({ events, onSave, canEdit, isKm, staffOptions }) {
  const L = (en, km) => (isKm ? km : en);
  const [cursor, setCursor] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const [sel, setSel] = useState(todayISO());
  const [filter, setFilter] = useState("all");
  const [form, setForm] = useState(null);
  const today = todayISO();
  const y = cursor.getFullYear(), m = cursor.getMonth();
  const offset = (new Date(y, m, 1).getDay() + 6) % 7;                       // ចាប់ផ្តើមថ្ងៃច័ន្ទ
  const nDays = new Date(y, m + 1, 0).getDate();
  const cells = Array.from({ length: Math.ceil((offset + nDays) / 7) * 7 }, (_, i) => new Date(y, m, 1 - offset + i));
  const vis = events.filter((e) => filter === "all" || e.type === filter);
  const onDay = (iso) => vis.filter((e) => e.start <= iso && (e.end || e.start) >= iso);
  const label = (e) => (e.type === "leave" ? `${e.staff || "?"}` : e.title);
  const monthStart = isoOf(new Date(y, m, 1)), monthEnd = isoOf(new Date(y, m + 1, 0));
  const inMonth = (e) => e.start <= monthEnd && (e.end || e.start) >= monthStart;
  const stats = {
    leave: events.filter((e) => e.type === "leave" && inMonth(e)).length,
    open: events.filter((e) => e.type === "todo" && !e.done).length,
    overdue: events.filter((e) => e.type === "todo" && !e.done && (e.end || e.start) < today).length,
    done: events.filter((e) => e.type === "todo" && e.done && inMonth(e)).length,
  };
  const upcoming = events.filter((e) => e.type === "todo" && !e.done).sort((a, b) => (a.end || a.start).localeCompare(b.end || b.start)).slice(0, 8);
  const monthLabel = cursor.toLocaleDateString(isKm ? "km-KH" : "en-GB", { month: "long", year: "numeric" });
  const save = (list) => onSave(list);
  const toggleDone = (id) => save(events.map((e) => (e.id === id ? { ...e, done: !e.done } : e)));
  const remove = (id) => { if (window.confirm(L("Delete this item?", "លុបធាតុនេះ?"))) save(events.filter((e) => e.id !== id)); };
  const openNew = (type = "todo") => setForm({ id: "", type, title: "", staff: "", leaveKind: LEAVE_KINDS[0], start: sel, end: sel, priority: "Medium", done: false, note: "" });
  const submit = (e) => {
    e.preventDefault();
    const f = { ...form, end: form.end && form.end >= form.start ? form.end : form.start };
    if (f.type === "leave" ? !f.staff.trim() : !f.title.trim()) return alert(L("Please fill in the required field.", "សូមបំពេញព័ត៌មានចាំបាច់។"));
    save(f.id ? events.map((x) => (x.id === f.id ? f : x)) : [...events, { ...f, id: msId() }]);
    setSel(f.start); setForm(null);
  };
  const chipBtn = (k, lb) => <button key={k} onClick={() => setFilter(k)} className={`px-2.5 py-1 rounded-full text-[11px] font-bold border ${filter === k ? "bg-blue-600 text-white border-blue-600" : "border-slate-300 dark:border-[#333] text-slate-600 dark:text-slate-300"}`}>{lb}</button>;
  const stat = (lb, v, c) => <div className="p-2.5 rounded-xl border border-slate-200 dark:border-[#222] bg-slate-50/60 dark:bg-slate-900/50"><div className="text-[10px] font-bold uppercase text-slate-500">{lb}</div><div className="text-2xl font-black tabular-nums" style={{ color: c }}>{v}</div></div>;

  const EventRow = ({ e }) => {
    const ty = CAL_TYPES[e.type];
    const late = e.type === "todo" && !e.done && (e.end || e.start) < today;
    return (
      <div className="p-2.5 rounded-lg border border-slate-200 dark:border-[#222] bg-white dark:bg-[#121212] flex gap-2.5" style={{ borderLeft: `4px solid ${ty.dot}` }}>
        {e.type === "todo" && <input type="checkbox" checked={!!e.done} disabled={!canEdit} onChange={() => toggleDone(e.id)} className="mt-1 w-4 h-4 shrink-0" />}
        <div className="min-w-0 flex-1">
          <div className="flex flex-wrap items-center gap-1.5">
            <span className={`px-1.5 py-0.5 rounded-full text-[9px] font-bold border ${ty.chip}`}>{isKm ? ty.km : ty.en}</span>
            {e.type === "leave" && <span className="text-[10px] font-bold text-amber-700 dark:text-amber-300">{e.leaveKind}</span>}
            {e.type === "todo" && e.priority && <span className={`text-[9px] font-bold px-1.5 rounded-full ${e.priority === "High" ? "bg-rose-500/15 text-rose-600" : e.priority === "Low" ? "bg-slate-500/15 text-slate-500" : "bg-amber-500/15 text-amber-600"}`}>{e.priority}</span>}
            {late && <span className="text-[9px] font-bold px-1.5 rounded-full bg-rose-600 text-white">{L("Overdue", "ហួសកំណត់")}</span>}
          </div>
          <div className={`text-xs font-bold mt-0.5 break-words ${e.done ? "line-through opacity-60" : ""}`}>{e.type === "leave" ? e.staff : e.title}</div>
          <div className="text-[10px] font-mono text-slate-500 dark:text-slate-400">{dmy(e.start)}{e.end && e.end !== e.start ? ` → ${dmy(e.end)}` : ""}</div>
          {e.note && <div className="text-[11px] text-slate-600 dark:text-slate-300 mt-0.5 break-words">{e.note}</div>}
        </div>
        {canEdit && <div className="flex flex-col gap-1 shrink-0">
          <button onClick={() => setForm({ ...e })} className="p-1 text-slate-500 hover:text-blue-600"><Icon name="Pencil" size={13} /></button>
          <button onClick={() => remove(e.id)} className="p-1 text-slate-500 hover:text-rose-600"><Icon name="Trash2" size={13} /></button>
        </div>}
      </div>
    );
  };

  const dayEvents = onDay(sel);
  const dayNames = isKm ? ["ច័ន្ទ", "អង្គារ", "ពុធ", "ព្រហ.", "សុក្រ", "សៅរ៍", "អាទិត្យ"] : ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  return (
    <div className="space-y-4">
      <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
        <div>
          <h3 className="text-base font-black uppercase">{L("Leave Record & To-Do List", "កំណត់ត្រាច្បាប់ និងបញ្ជីការងារ")}</h3>
          <p className="text-[11px] text-slate-500 dark:text-slate-400">{L("Click a day to see or add leave, to-do items and notes.", "ចុចលើថ្ងៃណាមួយ ដើម្បីមើល ឬបន្ថែមច្បាប់ ការងារ និងកំណត់ចំណាំ។")}</p>
        </div>
        {canEdit && <div className="flex flex-wrap gap-2">
          {["leave", "todo", "note"].map((k) => <button key={k} onClick={() => openNew(k)} className="px-3 py-1.5 rounded-md text-xs font-bold text-white" style={{ background: CAL_TYPES[k].dot }}>＋ {isKm ? CAL_TYPES[k].km : CAL_TYPES[k].en}</button>)}
        </div>}
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        {stat(L("Leaves this month", "ច្បាប់ក្នុងខែនេះ"), stats.leave, "#F59E0B")}
        {stat(L("Open to-dos", "ការងារមិនទាន់ចប់"), stats.open, "#3B5BDB")}
        {stat(L("Overdue", "ហួសកំណត់"), stats.overdue, "#E11D48")}
        {stat(L("Done this month", "បានសម្រេចខែនេះ"), stats.done, "#059669")}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div className="lg:col-span-2 space-y-3">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center gap-1.5">
              <button onClick={() => setCursor(new Date(y, m - 1, 1))} className="p-1.5 rounded border border-inherit"><Icon name="ChevronLeft" size={14} /></button>
              <div className="font-black text-sm w-40 text-center">{monthLabel}</div>
              <button onClick={() => setCursor(new Date(y, m + 1, 1))} className="p-1.5 rounded border border-inherit"><Icon name="ChevronRight" size={14} /></button>
              <button onClick={() => { const d = new Date(); setCursor(new Date(d.getFullYear(), d.getMonth(), 1)); setSel(todayISO()); }} className="px-2.5 py-1 rounded border border-inherit text-[11px] font-bold">{L("Today", "ថ្ងៃនេះ")}</button>
            </div>
            <div className="flex flex-wrap gap-1.5">{chipBtn("all", L("All", "ទាំងអស់"))}{["leave", "todo", "note"].map((k) => chipBtn(k, isKm ? CAL_TYPES[k].km : CAL_TYPES[k].en))}</div>
          </div>
          <div className="rounded-xl overflow-hidden border border-slate-200 dark:border-[#222]">
            <div className="grid grid-cols-7 bg-slate-100 dark:bg-slate-900 text-[10px] font-bold uppercase text-slate-500 text-center">{dayNames.map((d) => <div key={d} className="py-1.5">{d}</div>)}</div>
            <div className="grid grid-cols-7">
              {cells.map((d) => {
                const iso = isoOf(d), evs = onDay(iso), inM = d.getMonth() === m, isSel = iso === sel, isToday = iso === today;
                return (
                  <button key={iso} onClick={() => setSel(iso)} className={`min-h-[58px] sm:min-h-[92px] p-1 text-left border-t border-l border-slate-200 dark:border-[#222] align-top ${inM ? "" : "opacity-40"} ${d.getDay() === 0 || d.getDay() === 6 ? "bg-slate-50/70 dark:bg-slate-900/40" : ""} ${isSel ? "ring-2 ring-inset ring-blue-500 bg-blue-500/5" : "hover:bg-slate-100 dark:hover:bg-slate-900"}`}>
                    <span className={`inline-flex w-6 h-6 items-center justify-center rounded-full text-[11px] font-bold ${isToday ? "bg-blue-600 text-white" : ""}`}>{d.getDate()}</span>
                    <div className="hidden sm:block mt-0.5 space-y-0.5">
                      {evs.slice(0, 3).map((e) => <div key={e.id} className={`truncate text-[10px] px-1 rounded border ${CAL_TYPES[e.type].chip} ${e.done ? "line-through opacity-60" : ""}`}>{label(e)}</div>)}
                      {evs.length > 3 && <div className="text-[9px] text-slate-500 pl-1">+{evs.length - 3}</div>}
                    </div>
                    <div className="sm:hidden flex flex-wrap gap-0.5 mt-1">{evs.slice(0, 6).map((e) => <i key={e.id} className="w-1.5 h-1.5 rounded-full" style={{ background: CAL_TYPES[e.type].dot }} />)}</div>
                  </button>
                );
              })}
            </div>
          </div>
        </div>

        <div className="space-y-4">
          <div className="space-y-2">
            <div className="flex items-center justify-between">
              <div className="font-bold text-xs uppercase">{dmy(sel)}{sel === today ? ` · ${L("Today", "ថ្ងៃនេះ")}` : ""}</div>
              {canEdit && <button onClick={() => openNew("todo")} className="text-[11px] font-bold text-blue-600">＋ {L("Add", "បន្ថែម")}</button>}
            </div>
            {dayEvents.length === 0 ? <div className="text-xs text-slate-500 py-4 text-center border border-dashed border-slate-300 dark:border-[#333] rounded-lg">{L("Nothing on this day.", "គ្មានអ្វីក្នុងថ្ងៃនេះ។")}</div> : dayEvents.map((e) => <EventRow key={e.id} e={e} />)}
          </div>
          <div className="space-y-2">
            <div className="font-bold text-xs uppercase text-slate-500">{L("Open to-dos (by due date)", "ការងារមិនទាន់ចប់ (តាមថ្ងៃកំណត់)")}</div>
            {upcoming.length === 0 ? <div className="text-xs text-slate-500">—</div> : upcoming.map((e) => <EventRow key={e.id} e={e} />)}
          </div>
        </div>
      </div>

      {form && (
        <Modal title={form.id ? L("Edit item", "កែធាតុ") : L("Add item", "បន្ថែមធាតុ")} onClose={() => setForm(null)} width="max-w-lg">
          <form onSubmit={submit} className="space-y-3">
            <div className="flex gap-1.5">
              {["leave", "todo", "note"].map((k) => <button type="button" key={k} onClick={() => setForm({ ...form, type: k })}
                className={`flex-1 py-1.5 rounded-md text-xs font-bold border ${form.type === k ? "text-white border-transparent" : "border-slate-300 dark:border-[#333]"}`} style={form.type === k ? { background: CAL_TYPES[k].dot } : {}}>{isKm ? CAL_TYPES[k].km : CAL_TYPES[k].en}</button>)}
            </div>
            {form.type === "leave" ? (
              <>
                <Field label={L("Staff name *", "ឈ្មោះបុគ្គលិក *")}><input list="cal-staff" value={form.staff} className={INPUT} onChange={(e) => setForm({ ...form, staff: e.target.value })} /><datalist id="cal-staff">{staffOptions.map((s) => <option key={s} value={s} />)}</datalist></Field>
                <Field label={L("Leave type", "ប្រភេទច្បាប់")}><select value={form.leaveKind} className={INPUT} onChange={(e) => setForm({ ...form, leaveKind: e.target.value })}>{LEAVE_KINDS.map((k) => <option key={k}>{k}</option>)}</select></Field>
              </>
            ) : (
              <Field label={form.type === "todo" ? L("Task *", "ការងារ *") : L("Note *", "កំណត់ចំណាំ *")}><input value={form.title} className={INPUT} onChange={(e) => setForm({ ...form, title: e.target.value })} /></Field>
            )}
            <div className="grid grid-cols-2 gap-2">
              <Field label={form.type === "leave" ? L("From", "ចាប់ពី") : L("Date / start", "ថ្ងៃ / ចាប់ផ្តើម")}><input type="date" required value={form.start} className={INPUT} onChange={(e) => setForm({ ...form, start: e.target.value, end: form.end < e.target.value ? e.target.value : form.end })} /></Field>
              <Field label={form.type === "leave" ? L("To", "ដល់") : L("Due / end", "ថ្ងៃកំណត់ / បញ្ចប់")}><input type="date" value={form.end} min={form.start} className={INPUT} onChange={(e) => setForm({ ...form, end: e.target.value })} /></Field>
            </div>
            {form.type === "todo" && (
              <div className="grid grid-cols-2 gap-2">
                <Field label={L("Priority", "អាទិភាព")}><select value={form.priority} className={INPUT} onChange={(e) => setForm({ ...form, priority: e.target.value })}>{["Low", "Medium", "High"].map((p) => <option key={p}>{p}</option>)}</select></Field>
                <Field label={L("Status", "ស្ថានភាព")}><select value={form.done ? "done" : "open"} className={INPUT} onChange={(e) => setForm({ ...form, done: e.target.value === "done" })}><option value="open">{L("Open", "មិនទាន់ចប់")}</option><option value="done">{L("Done", "ចប់")}</option></select></Field>
              </div>
            )}
            <Field label={L("Remark", "កំណត់សម្គាល់")}><textarea value={form.note} rows={2} className={INPUT} onChange={(e) => setForm({ ...form, note: e.target.value })} /></Field>
            <div className="flex justify-between pt-2 border-t border-inherit">
              {form.id ? <button type="button" onClick={() => { remove(form.id); setForm(null); }} className="px-3 py-1.5 rounded border border-rose-400 text-rose-600 font-bold">{L("Delete", "លុប")}</button> : <span />}
              <div className="flex gap-2"><button type="button" onClick={() => setForm(null)} className="px-3 py-1.5 rounded border border-inherit">{L("Cancel", "បោះបង់")}</button><button type="submit" className="px-4 py-1.5 rounded bg-blue-600 text-white font-bold">{L("Save", "រក្សាទុក")}</button></div>
            </div>
