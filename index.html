    </div>
  );

  // ===== Popup ទាំង ៤ (បង្ហាញតែមួយក្នុងពេលតែមួយ តាមតម្លៃ modal) =====

  // ១) ចុះឈ្មោះតាម Google
  const loginModal = modal === "login" && (
    <Modal title={t.googleAuthNotice} onClose={() => setModal(null)}>
      <p className="py-4 text-center text-slate-600 dark:text-slate-300">Register or log in using your corporate Google Account to request staff access from the Project Admin.</p>
      <button onClick={simulateGoogleLogin} className="w-full py-2.5 rounded-md bg-blue-600 hover:bg-blue-700 text-white font-bold flex items-center justify-center gap-2">
        <Icon name="UserPlus" /><span>{sb ? "Continue with Google" : "Continue with Google (Simulate)"}</span>
      </button>
    </Modal>
  );

  // ២) Admin អនុម័ត / ដកសិទ្ធិ និងកំណត់សិទ្ធិតាមផ្នែកសម្រាប់អ្នកប្រើម្នាក់ៗ (កែបានគ្រប់ពេលក្រោយ Approve)
  const permTarget = sb ? (users.find((u) => u.id === permUserId) || users.find((u) => u.status === "approved" && u.role !== "admin")) : null;
  const editPerms = sb ? (permTarget?.perms || {}) : permissions; // សិទ្ធិដែលកំពុងកែ
  const setEditPerm = async (key, value) => {
    if (!sb) return setPermissions({ ...permissions, [key]: value });
    if (!permTarget) return;
    const perms = { ...(permTarget.perms || {}), [key]: value };
    setUsers(users.map((u) => (u.id === permTarget.id ? { ...u, perms } : u))); // បង្ហាញភ្លាម
    const { error } = await sb.from("profiles").update({ perms }).eq("id", permTarget.id); // រក្សាទុកក្នុង Database ស្វ័យប្រវត្តិ
    if (error) alert(error.message);
  };
  const permissionsModal = modal === "permissions" && isAdmin && (
    <Modal title={t.managePermissions} onClose={() => setModal(null)} width="max-w-lg">
      <div className="space-y-2">
        <div className="font-bold uppercase text-slate-500">Registered Users</div>
        {users.map((u) => (
          <div key={u.id} className={`flex items-center justify-between p-2.5 rounded border ${sb && permTarget && permTarget.id === u.id ? "border-blue-500" : "border-inherit"}`}>
            <div className="flex items-center gap-2">
              <img src={u.photo} alt={u.name} className="w-7 h-7 rounded-full object-cover" />
              <div><div className="font-bold">{u.name}</div><div className="text-[10px] text-slate-500">{u.email}</div></div>
            </div>
            {u.role === "admin" ? (
              <span className="text-[10px] font-bold text-blue-500">Admin</span>
            ) : u.status === "pending" ? (
              <button onClick={() => approveUser(u.id)} className="px-2.5 py-1 rounded bg-emerald-600 text-white font-bold text-[10px] flex items-center gap-1"><Icon name="Check" size={12} /> Approve</button>
            ) : (
              <div className="flex items-center gap-1">
                {sb && <button onClick={() => setPermUserId(u.id)} className="px-2 py-1 rounded bg-blue-600 text-white font-bold text-[10px]">Edit access</button>}
                <button onClick={() => revokeUser(u.id)} className="px-2 py-1 rounded bg-rose-600 text-white font-bold text-[10px]">Revoke</button>
              </div>
            )}
          </div>
        ))}
      </div>
      <div className="space-y-2 pt-2 border-t border-inherit">
        <div className="font-bold uppercase text-slate-500">
          Section Access: {sb ? (permTarget ? permTarget.name : "—") : "All Staff"}
        </div>
        {sb && !permTarget ? (
          <div className="text-[11px] text-slate-500">{isKm ? "Approve អ្នកប្រើមុន ឬចុច Edit access ដើម្បីកំណត់សិទ្ធិ។" : "Approve a user first, or press Edit access to set permissions."}</div>
        ) : (
          <>
            {categories.map((cat) => (
              <label key={cat.key} className="flex items-center justify-between p-2 rounded border border-inherit cursor-pointer">
                <span className="font-bold">{isKm ? cat.labelKm : cat.label}</span>
                <input type="checkbox" checked={editPerms[cat.key] || false} className="w-4 h-4" onChange={(e) => setEditPerm(cat.key, e.target.checked)} />
              </label>
            ))}
            <label className="flex items-center justify-between p-2 rounded border border-blue-500/40 cursor-pointer">
              <span className="font-bold">{t.allowEdit}</span>
              <input type="checkbox" checked={editPerms.canEdit || false} className="w-4 h-4" onChange={(e) => setEditPerm("canEdit", e.target.checked)} />
            </label>
            <div className="text-[10px] text-slate-500">{isKm ? "ការផ្លាស់ប្តូររក្សាទុកស្វ័យប្រវត្តិ។ អ្នកប្រើឃើញសិទ្ធិថ្មីពេល refresh ទំព័រ។" : "Changes save automatically. The user sees new access after refreshing the page."}</div>
          </>
        )}
      </div>
      <div className="flex justify-end"><button onClick={() => setModal(null)} className="px-4 py-1.5 rounded bg-blue-600 text-white font-bold">Close</button></div>
    </Modal>
  );

  // ៣) បញ្ចូលឯកសារថ្មី
  const subFolderOptions = (categories.find((c) => c.key === newDoc.category) || { subFolders: [], subFoldersKm: [] });
  const uploadModal = modal === "upload" && canEditData && (
    <Modal title={t.uploadFile} onClose={() => setModal(null)}>
      <form onSubmit={uploadDocument} className="space-y-3">
        <Field label={t.browse}>
          <input type="file" required className={INPUT}
            onChange={(e) => {
              const f = e.target.files[0]; if (!f) return;
              setNewFile(f);
              setNewDoc({ ...newDoc, name: newDoc.name || f.name.replace(/\.[^.]+$/, ""), format: guessFormat(f.name) }); // ទាយឈ្មោះ និង Format
            }} />
        </Field>
        <Field label="Document No.">
          <input type="text" required value={newDoc.docNum} className={`${INPUT} font-mono uppercase`} placeholder="NTB-SPT-BP-SD-STR-0001-V00"
            onChange={(e) => setNewDoc({ ...newDoc, docNum: e.target.value.toUpperCase() })} />
          <div className="mt-1 text-[10px] text-slate-500 dark:text-slate-400 font-mono">e.g. NTB-SPT-BP-SD-STR-0001-V00 · NTB-SPT-XX-CD-ARC-0002-V00</div>
        </Field>
        <Field label="Document Title">
          <input type="text" required value={newDoc.name} className={INPUT} placeholder="e.g. Method Statement for Abutment Concrete"
            onChange={(e) => setNewDoc({ ...newDoc, name: e.target.value })} />
        </Field>
        <Field label="Category">
          <select value={newDoc.category} className={INPUT}
            onChange={(e) => {
              const cat = categories.find((c) => c.key === e.target.value);
              setNewDoc({ ...newDoc, category: e.target.value, subFolder: cat.subFolders.find((s) => !CUSTOM_SUBS_LIST.includes(s)) || "" }); // ប្តូរប្រភេទ → ជ្រើស Sub-Folder ដំបូងឲ្យ
            }}>
            {categories.map((c) => <option key={c.key} value={c.key}>{isKm ? c.labelKm : c.label}</option>)}
          </select>
        </Field>
        {subFolderOptions.subFolders.length > 0 && (
          <Field label="Sub-Folder">
            <select value={newDoc.subFolder} className={INPUT} onChange={(e) => setNewDoc({ ...newDoc, subFolder: e.target.value })}>
              {subFolderOptions.subFolders.map((sub, i) => (CUSTOM_SUBS_LIST.includes(sub) ? null : <option key={sub} value={sub}>{isKm ? subFolderOptions.subFoldersKm[i] : sub}</option>))}
            </select>
          </Field>
        )}
        <div className="grid grid-cols-2 gap-2">
          <Field label="Format">
            <select value={newDoc.format} className={INPUT} onChange={(e) => setNewDoc({ ...newDoc, format: e.target.value })}>
              {FORMATS.map((f) => <option key={f}>{f}</option>)}
            </select>
          </Field>
          <Field label="Status">
            <select value={newDoc.status} className={INPUT} onChange={(e) => setNewDoc({ ...newDoc, status: e.target.value })}>
              {STATUSES.map((s) => <option key={s}>{s}</option>)}
            </select>
          </Field>
        </div>
        <div className="flex justify-end gap-2 pt-2">
          <button type="button" onClick={() => setModal(null)} className="px-3 py-1.5 rounded border border-inherit">{t.cancel}</button>
          <button type="submit" className="px-4 py-1.5 rounded bg-blue-600 text-white font-bold">{t.submit}</button>
        </div>
      </form>
    </Modal>
  );

// ៤) កែប្រែទិន្នន័យ Dashboard (% សម្រេច, ថ្ងៃចាប់ផ្តើម/បញ្ចប់, S-Curve Actual)
// ៤) កែប្រែទិន្នន័យ Dashboard (% សម្រេច, ថ្ងៃចាប់ផ្តើម/បញ្ចប់, S-Curve Actual)
  const editDashModal = modal === "editDash" && canEditData && editForm && (
    <Modal title={t.editDashData} onClose={() => setModal(null)} width="max-w-xl">
      <form onSubmit={saveEditDash} className="space-y-4">
        <div className="grid grid-cols-3 gap-3">
          <Field label={isKm ? "Completion (%) — Auto ពី S-Curve" : "Completion (%) — auto from S-Curve"}>
            {(() => { const la = [...editForm.sCurve].reverse().find((d) => Number(d.actual) > 0);
              return <div className={`${INPUT} bg-slate-100 dark:bg-slate-900 font-bold text-emerald-600 dark:text-emerald-400`}>{la ? `${la.actual}%  (${la.month})` : "0%"}</div>; })()}
          </Field>
          <Field label="Project Start Date">
            <input type="date" value={editForm.dates.startDate} className={INPUT} onChange={(e) => setEditForm({ ...editForm, dates: { ...editForm.dates, startDate: e.target.value } })} />
          </Field>
          <Field label="Project End Date">
            <input type="date" value={editForm.dates.endDate} className={INPUT} onChange={(e) => setEditForm({ ...editForm, dates: { ...editForm.dates, endDate: e.target.value } })} />
          </Field>
        </div>

        <div className="pt-2 border-t border-inherit space-y-2">
          <div className="font-bold uppercase text-blue-600">RFI / RFA / SI / NCR <span className="normal-case font-normal text-slate-500">— {isKm ? "ទទេ = រាប់ស្វ័យប្រវត្តិពីឯកសារ" : "empty = auto count from documents"}</span></div>
          <div className="grid grid-cols-4 gap-2">
            {["RFI", "RFA", "SI", "NCR"].map((k) => (
              <Field key={k} label={k}>
                <input type="number" min="0" className={INPUT} placeholder={`Auto: ${countType(k + " Folder", k)}`} value={editForm.trackers[k]}
                  onChange={(e) => setEditForm({ ...editForm, trackers: { ...editForm.trackers, [k]: e.target.value === "" ? "" : Math.max(0, Number(e.target.value)) } })} />
              </Field>
            ))}
          </div>
        </div>

        <div className="flex items-center justify-between pt-2 border-t border-inherit">
          <div className="font-bold uppercase text-blue-600">S-Curve Monthly Progress Data</div>
          {/* ប៊ូតុងបន្ថែមខែថ្មី */}
          <button 
            type="button" 
            onClick={() => {
              const lastItem = editForm.sCurve[editForm.sCurve.length - 1];
              const newMonthName = prompt("បញ្ចូលឈ្មោះខែថ្មី (ឧទាហរណ៍: Jan-27):", "Jan-27");
              if (!newMonthName) return;
              setEditForm({
                ...editForm,
                sCurve: [
                  ...editForm.sCurve,
                  { month: newMonthName, planned: lastItem ? lastItem.planned : 100, actual: 0 }
                ]
              });
            }} 
            className="px-2.5 py-1 rounded bg-emerald-600 text-white font-bold text-xs"
          >
            + បន្ថែមខែ (Add Month)
          </button>
        </div>

        <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
          {editForm.sCurve.map((item, i) => (
            <div key={i} className="flex items-center gap-2 bg-slate-50 dark:bg-slate-900 p-2 rounded border border-inherit">
              <input 
                type="text" 
                value={item.month} 
                className={`${INPUT} w-24 font-bold`} 
                onChange={(e) => setEditForm({
                  ...editForm,
                  sCurve: editForm.sCurve.map((d, j) => (j === i ? { ...d, month: e.target.value } : d))
                })} 
              />
              <div className="flex items-center gap-1 flex-1">
                <span className="text-[10px] text-blue-600 font-bold">Plan%:</span>
                <input 
                  type="number" 
                  value={item.planned} 
                  className={INPUT} 
                  onChange={(e) => setEditForm({
                    ...editForm,
                    sCurve: editForm.sCurve.map((d, j) => (j === i ? { ...d, planned: Number(e.target.value) } : d))
                  })} 
                />
              </div>
              <div className="flex items-center gap-1 flex-1">
                <span className="text-[10px] text-rose-600 font-bold">Actual%:</span>
                <input 
                  type="number" 
                  value={item.actual} 
                  className={INPUT} 
                  onChange={(e) => setEditForm({
                    ...editForm,
                    sCurve: editForm.sCurve.map((d, j) => (j === i ? { ...d, actual: Number(e.target.value) } : d))
                  })} 
                />
              </div>
              {/* ប៊ូតុងលុបខែ */}
              <button 
                type="button" 
                onClick={() => setEditForm({
                  ...editForm,
                  sCurve: editForm.sCurve.filter((_, j) => j !== i)
                })} 
                className="p-1 text-slate-400 hover:text-rose-600"
              >
                <Icon name="Trash2" size={14} />
              </button>
            </div>
          ))}
        </div>

        <div className="flex justify-end gap-2 pt-4 border-t border-inherit">
          <button type="button" onClick={() => setModal(null)} className="px-3 py-1.5 rounded-md border border-inherit">{t.cancel}</button>
          <button type="submit" className="px-4 py-1.5 rounded-md font-bold bg-blue-600 hover:bg-blue-700 text-white">{t.saveChanges}</button>
        </div>
      </form>
    </Modal>
  );

  // ៥) កែតារាង (Machinery, Manpower, Milestones, Weekly)
  const editListModal = editing && canEditData && (
    <EditListModal cfg={EDIT_CONFIG[editing]} title={`${t.edit}: ${t[EDIT_CONFIG[editing].titleKey]}`} rows={data[editing]} t={t} isKm={isKm}
      onClose={() => setEditing(null)}
      onSave={(rows) => { setData({ ...data, [editing]: rows }); setEditing(null); }} />
  );

  /* ---------- ង. ផ្គុំគ្រប់ផ្នែកជាទំព័រពេញ ---------- */
  return (
    <div className={`h-[100dvh] overflow-hidden flex text-sm bg-[#F4F7FC] text-[#111827] dark:bg-black dark:text-white ${isKm ? "font-khmer text-[15px] leading-relaxed" : "font-serif"}`}>
      {sidebarOpen && <div className="fixed inset-0 z-30 bg-black/50 lg:hidden" onClick={() => setSidebarOpen(false)} />} {/* ផ្ទាំងបាំង: ចុចដើម្បីបិទ Sidebar លើទូរស័ព្ទ/Tablet */}
      {sidebar}
      <main className="flex-1 flex flex-col min-w-0 overflow-y-auto">
        {header}
        {sb && profile?.role === "pending" && (
          <div className="bg-amber-500 text-white px-6 py-2.5 text-xs font-bold">
            ⏳ {isKm ? "គណនីរបស់អ្នកកំពុងរង់ចាំការអនុម័តពី Admin។ អ្នកមើលបានតែ Dashboard រហូតដល់ត្រូវបានអនុម័ត។"
                     : "Your account is waiting for Admin approval. You can view the Dashboard only until approved."}
          </div>
        )}
        {accessDenied && (
          <div className="bg-rose-600 text-white px-6 py-2.5 text-xs font-bold flex items-center justify-between">
            <span className="flex items-center gap-2"><Icon name="Lock" /> {t.accessDenied}</span>
            <button onClick={() => setAccessDenied(false)}><Icon name="X" /></button>
          </div>
        )}
        <div className="p-3 sm:p-6 space-y-4 sm:space-y-6 flex-1">{activeTab === "dashboard" ? dashboard : categoryView}</div>
        <footer className="px-6 py-4 text-center text-[11px] border-t border-slate-200 dark:border-[#222] text-slate-500 dark:text-slate-400">
          {t.copyright}
        </footer>
      </main>
      {loginModal}
      {permissionsModal}
      {uploadModal}
      {editDashModal}
      {editListModal}
      {zoomChart && (
        <ZoomModal title={t.sCurveTitle} isKm={isKm} onClose={() => setZoomChart(false)}
          right={<div className="hidden sm:flex gap-2 text-[11px] font-bold"><span className="flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-700 dark:text-blue-300"><i className="w-2 h-2 rounded-full bg-[#3B5BDB]" />Planned</span><span className="flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-rose-500/10 text-rose-700 dark:text-rose-300"><i className="w-2 h-2 rounded-full bg-[#E11D48]" />Actual</span></div>}>
          {(w, rot) => <SCurveChart data={sCurve} width={w} rotated={rot} />}
        </ZoomModal>
      )}
      {report && (
        <PrintModal title="DAILY REPORT" t={t} isKm={isKm} preparedBy={currentUser.name} onClose={() => setReport(false)}>
          {(ctx) => <DailyReport ctx={ctx} r={{ t, isKm, completePct, completeMonth, daysElapsed, totalDays, remainingDays, dates, trackerCount, sCurve, data, photos }} />}
        </PrintModal>
      )}
    </div>
  );
}

// ចាប់ផ្តើមបង្ហាញ App ក្នុង <div id="root">
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
