          </form>
        </Modal>
      )}
    </div>
  );
}

/* =====================================================================
   WAREHOUSE: គ្រប់គ្រងស្តុក (Stock Balance) + កំណត់ត្រាចូល/ចេញ (Tracking Record)
   Balance = Opening + IN − OUT ; ជូនដំណឹងពេលស្តុកទាបជាង Min
   ===================================================================== */
const DEFAULT_STOCK = {
  items: [
    { id: "s1", code: "MAT-001", name: "Cement (50 kg bag)", unit: "bag", category: "Material", opening: 500, min: 100, location: "Warehouse A" },
    { id: "s2", code: "MAT-002", name: "Rebar D16", unit: "ton", category: "Material", opening: 12, min: 3, location: "Steel yard" },
    { id: "s3", code: "MAT-003", name: "Rebar D12", unit: "ton", category: "Material", opening: 8, min: 2, location: "Steel yard" },
    { id: "s4", code: "FUE-001", name: "Diesel", unit: "L", category: "Fuel", opening: 2000, min: 500, location: "Fuel tank" },
    { id: "s5", code: "PPE-001", name: "Safety helmet", unit: "pcs", category: "PPE", opening: 60, min: 20, location: "Warehouse A" },
  ],
  tx: [
    { id: "t1", date: addDaysISO(-6), itemId: "s1", type: "OUT", qty: 120, ref: "MR-001", party: "Pier P2 concrete", note: "", by: "" },
    { id: "t2", date: addDaysISO(-4), itemId: "s4", type: "OUT", qty: 650, ref: "", party: "Excavators / generators", note: "Weekly fuel", by: "" },
    { id: "t3", date: addDaysISO(-3), itemId: "s2", type: "IN", qty: 6, ref: "PO-014", party: "ABC Steel Co.", note: "", by: "" },
    { id: "t4", date: addDaysISO(-1), itemId: "s5", type: "OUT", qty: 45, ref: "", party: "New workers", note: "", by: "" },
  ],
};

function StockManager({ state, onSave, canEdit, isKm, userName }) {
  const L = (en, km) => (isKm ? km : en);
  const items = state.items || [], tx = state.tx || [];
  const [tab, setTab] = useState("stock");
  const [q, setQ] = useState("");
  const [cat, setCat] = useState("ALL");
  const [lowOnly, setLowOnly] = useState(false);
  const [fType, setFType] = useState("ALL");
  const [fItem, setFItem] = useState("ALL");
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const [itemForm, setItemForm] = useState(null);
  const [txForm, setTxForm] = useState(null);

  const calc = {};
  items.forEach((i) => { calc[i.id] = { inn: 0, out: 0 }; });
  tx.forEach((x) => { if (calc[x.itemId]) { if (x.type === "IN") calc[x.itemId].inn += Number(x.qty); else calc[x.itemId].out += Number(x.qty); } });
  const bal = (i) => Number(i.opening || 0) + calc[i.id].inn - calc[i.id].out;
  const status = (i) => { const b = bal(i); return b <= 0 ? ["Out of stock", "bg-rose-600 text-white"] : b <= Number(i.min || 0) ? ["Low", "bg-amber-500/20 text-amber-700 dark:text-amber-300"] : ["OK", "bg-emerald-500/15 text-emerald-700 dark:text-emerald-300"]; };
  const itemById = Object.fromEntries(items.map((i) => [i.id, i]));
  const cats = [...new Set(items.map((i) => i.category).filter(Boolean))];
  const lowCount = items.filter((i) => bal(i) <= Number(i.min || 0)).length;
  const mStart = todayISO().slice(0, 8) + "01";
  const monthIn = tx.filter((x) => x.type === "IN" && x.date >= mStart).length, monthOut = tx.filter((x) => x.type === "OUT" && x.date >= mStart).length;

  // សមតុល្យបន្ទាប់ពីប្រតិបត្តិការនីមួយៗ (Running balance)
  const after = {};
  const run = Object.fromEntries(items.map((i) => [i.id, Number(i.opening || 0)]));
  [...tx].sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id)).forEach((x) => { run[x.itemId] = (run[x.itemId] || 0) + (x.type === "IN" ? 1 : -1) * Number(x.qty); after[x.id] = run[x.itemId]; });

  const shownItems = items.filter((i) => (cat === "ALL" || i.category === cat) && (!lowOnly || bal(i) <= Number(i.min || 0)) && `${i.code} ${i.name} ${i.location}`.toLowerCase().includes(q.toLowerCase()));
  const shownTx = tx.filter((x) => (fType === "ALL" || x.type === fType) && (fItem === "ALL" || x.itemId === fItem) && (!from || x.date >= from) && (!to || x.date <= to)
    && `${(itemById[x.itemId] || {}).name} ${x.ref} ${x.party} ${x.note}`.toLowerCase().includes(q.toLowerCase())).sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

  const setState = (patch) => onSave({ items, tx, ...patch });
  const saveItem = (e) => {
    e.preventDefault();
    const f = { ...itemForm, opening: Number(itemForm.opening) || 0, min: Number(itemForm.min) || 0 };
    if (!f.name.trim()) return;
    setState({ items: f.id ? items.map((i) => (i.id === f.id ? f : i)) : [...items, { ...f, id: msId() }] });
    setItemForm(null);
  };
  const delItem = (i) => { if (window.confirm(L(`Delete "${i.name}" and all its records?`, `លុប "${i.name}" និងកំណត់ត្រាទាំងអស់?`))) setState({ items: items.filter((x) => x.id !== i.id), tx: tx.filter((x) => x.itemId !== i.id) }); };
  const saveTx = (e) => {
    e.preventDefault();
    const f = { ...txForm, qty: Number(txForm.qty) };
    const it = itemById[f.itemId];
    if (!it || !(f.qty > 0)) return alert(L("Select an item and enter a quantity above 0.", "សូមជ្រើសសម្ភារ និងវាយបរិមាណលើសពី 0។"));
    const available = bal(it) + (f.id ? ((tx.find((x) => x.id === f.id) || {}).type === "OUT" ? Number((tx.find((x) => x.id === f.id) || {}).qty) : 0) : 0);
    if (f.type === "OUT" && f.qty > available) return alert(L(`Not enough stock. Available: ${available} ${it.unit}`, `ស្តុកមិនគ្រប់គ្រាន់។ មាន: ${available} ${it.unit}`));
    setState({ tx: f.id ? tx.map((x) => (x.id === f.id ? f : x)) : [...tx, { ...f, id: msId() }] });
    setTxForm(null);
  };
  const delTx = (id) => { if (window.confirm(L("Delete this record?", "លុបកំណត់ត្រានេះ?"))) setState({ tx: tx.filter((x) => x.id !== id) }); };
  const newTx = (type, itemId = "") => setTxForm({ id: "", date: todayISO(), itemId: itemId || (items[0] ? items[0].id : ""), type, qty: "", ref: "", party: "", note: "", by: userName || "" });
  const exportCsv = () => {
    const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const rows = [["Date", "Code", "Item", "Unit", "Type", "Qty", "Ref No.", "From/To/Used for", "Note", "By", "Balance after"]]
      .concat(shownTx.map((x) => { const i = itemById[x.itemId] || {}; return [x.date, i.code, i.name, i.unit, x.type, x.qty, x.ref, x.party, x.note, x.by, after[x.id]]; }));
    const blob = new Blob(["\ufeff" + rows.map((r) => r.map(esc).join(",")).join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `stock-records-${todayISO()}.csv`; a.click();
  };
  const stat = (lb, v, c) => <div className="p-2.5 rounded-xl border border-slate-200 dark:border-[#222] bg-slate-50/60 dark:bg-slate-900/50"><div className="text-[10px] font-bold uppercase text-slate-500">{lb}</div><div className="text-2xl font-black tabular-nums" style={{ color: c }}>{v}</div></div>;
  const th = "py-2 px-2 text-[10px] font-bold uppercase whitespace-nowrap text-slate-600 dark:text-slate-300 text-left";
  const td = "py-1.5 px-2 whitespace-nowrap";
  const tabBtn = (k, lb) => <button key={k} onClick={() => setTab(k)} className={`px-3 py-1.5 rounded-md text-xs font-bold ${tab === k ? "bg-white dark:bg-slate-600 shadow text-blue-600 dark:text-white" : "text-slate-500"}`}>{lb}</button>;

  return (
    <div className="space-y-4">
      <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
        <div>
          <h3 className="text-base font-black uppercase">{L("Warehouse — Stock Management & Tracking Record", "ឃ្លាំង — គ្រប់គ្រងស្តុក និងកំណត់ត្រាតាមដាន")}</h3>
          <p className="text-[11px] text-slate-500 dark:text-slate-400">{L("Balance = Opening + IN − OUT. Record every stock in/out to keep a full tracking history.", "សមតុល្យ = ដើមគ្រា + ចូល − ចេញ។ កត់ត្រាគ្រប់ការចូល/ចេញ ដើម្បីមានប្រវត្តិតាមដានពេញលេញ។")}</p>
        </div>
        {canEdit && <div className="flex flex-wrap gap-2">
          <button onClick={() => newTx("IN")} className="px-3 py-1.5 rounded-md text-xs font-bold bg-emerald-600 text-white">⬇ {L("Stock IN", "ទទួលចូល")}</button>
          <button onClick={() => newTx("OUT")} className="px-3 py-1.5 rounded-md text-xs font-bold bg-rose-600 text-white">⬆ {L("Stock OUT", "ចេញប្រើ")}</button>
          <button onClick={() => setItemForm({ id: "", code: "", name: "", unit: "", category: "", opening: 0, min: 0, location: "" })} className="px-3 py-1.5 rounded-md text-xs font-bold border border-inherit text-blue-600">＋ {L("New item", "សម្ភារថ្មី")}</button>
        </div>}
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        {stat(L("Items", "ចំនួនសម្ភារ"), items.length, "#3B5BDB")}
        {stat(L("Low / out of stock", "ស្តុកទាប / អស់"), lowCount, lowCount ? "#E11D48" : "#059669")}
        {stat(L("IN records (month)", "ចូល (ខែនេះ)"), monthIn, "#059669")}
        {stat(L("OUT records (month)", "ចេញ (ខែនេះ)"), monthOut, "#F59E0B")}
      </div>

      <div className="flex flex-wrap items-center gap-2">
        <div className="inline-flex rounded-lg bg-slate-100 dark:bg-slate-800 p-0.5">{tabBtn("stock", L("Stock balance", "សមតុល្យស្តុក"))}{tabBtn("log", L("Tracking records", "កំណត់ត្រាតាមដាន"))}</div>
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder={L("Search…", "ស្វែងរក…")} className={`${INPUT} !w-44`} />
        {tab === "stock" ? (<>
          <select value={cat} onChange={(e) => setCat(e.target.value)} className={`${INPUT} !w-36`}><option value="ALL">{L("All categories", "គ្រប់ប្រភេទ")}</option>{cats.map((c) => <option key={c}>{c}</option>)}</select>
          <label className="flex items-center gap-1.5 text-xs font-bold"><input type="checkbox" checked={lowOnly} onChange={(e) => setLowOnly(e.target.checked)} />{L("Low stock only", "ស្តុកទាបតែប៉ុណ្ណោះ")}</label>
        </>) : (<>
          <select value={fType} onChange={(e) => setFType(e.target.value)} className={`${INPUT} !w-28`}><option value="ALL">IN + OUT</option><option value="IN">IN</option><option value="OUT">OUT</option></select>
          <select value={fItem} onChange={(e) => setFItem(e.target.value)} className={`${INPUT} !w-44`}><option value="ALL">{L("All items", "គ្រប់សម្ភារ")}</option>{items.map((i) => <option key={i.id} value={i.id}>{i.name}</option>)}</select>
          <input type="date" value={from} onChange={(e) => setFrom(e.target.value)} className={`${INPUT} !w-36`} /><span className="text-xs">→</span><input type="date" value={to} onChange={(e) => setTo(e.target.value)} className={`${INPUT} !w-36`} />
          <button onClick={exportCsv} className="px-3 py-1.5 rounded-md text-xs font-bold border border-inherit">⭳ CSV</button>
        </>)}
      </div>

      {tab === "stock" ? (
        <div className="overflow-x-auto rounded-lg border border-slate-200 dark:border-[#222]">
          <table className="w-full text-xs border-collapse">
            <thead><tr className="bg-slate-100 dark:bg-slate-900"><th className={th}>Code</th><th className={th}>{L("Item", "សម្ភារ")}</th><th className={th}>{L("Category", "ប្រភេទ")}</th><th className={th}>{L("Unit", "ឯកតា")}</th>
              <th className={`${th} text-right`}>{L("Opening", "ដើមគ្រា")}</th><th className={`${th} text-right`}>IN</th><th className={`${th} text-right`}>OUT</th><th className={`${th} text-right`}>{L("Balance", "សមតុល្យ")}</th><th className={`${th} text-right`}>Min</th><th className={th}>{L("Status", "ស្ថានភាព")}</th><th className={th}>{L("Location", "ទីតាំង")}</th>{canEdit && <th className={th}></th>}</tr></thead>
            <tbody>
              {shownItems.length === 0 && <tr><td colSpan={12} className="p-6 text-center text-slate-500">{L("No items.", "គ្មានសម្ភារ។")}</td></tr>}
              {shownItems.map((i) => { const [sl, sc] = status(i); const c = calc[i.id]; return (
                <tr key={i.id} className="border-t border-slate-100 dark:border-[#1d1d1d]">
                  <td className={`${td} font-mono text-[11px]`}>{i.code}</td><td className={`${td} font-bold`}>{i.name}</td><td className={td}>{i.category}</td><td className={td}>{i.unit}</td>
                  <td className={`${td} text-right tabular-nums`}>{i.opening}</td><td className={`${td} text-right tabular-nums text-emerald-600`}>{c.inn}</td><td className={`${td} text-right tabular-nums text-rose-600`}>{c.out}</td>
                  <td className={`${td} text-right tabular-nums font-black`}>{bal(i)}</td><td className={`${td} text-right tabular-nums text-slate-500`}>{i.min}</td>
                  <td className={td}><span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${sc}`}>{sl}</span></td><td className={td}>{i.location}</td>
                  {canEdit && <td className={`${td} text-right`}>
                    <button onClick={() => newTx("IN", i.id)} title="IN" className="px-1.5 text-emerald-600 font-bold">⬇</button>
                    <button onClick={() => newTx("OUT", i.id)} title="OUT" className="px-1.5 text-rose-600 font-bold">⬆</button>
                    <button onClick={() => setItemForm({ ...i })} className="px-1.5 text-slate-500 hover:text-blue-600"><Icon name="Pencil" size={13} /></button>
                    <button onClick={() => delItem(i)} className="px-1.5 text-slate-500 hover:text-rose-600"><Icon name="Trash2" size={13} /></button>
                  </td>}
                </tr>); })}
            </tbody>
          </table>
        </div>
      ) : (
        <div className="overflow-x-auto rounded-lg border border-slate-200 dark:border-[#222]">
          <table className="w-full text-xs border-collapse">
            <thead><tr className="bg-slate-100 dark:bg-slate-900"><th className={th}>{L("Date", "ថ្ងៃ")}</th><th className={th}>{L("Item", "សម្ភារ")}</th><th className={th}>{L("Type", "ប្រភេទ")}</th><th className={`${th} text-right`}>{L("Qty", "បរិមាណ")}</th><th className={th}>Ref No.</th>
              <th className={th}>{L("From / To / Used for", "ពី / ទៅ / ប្រើសម្រាប់")}</th><th className={th}>{L("Note", "កំណត់សម្គាល់")}</th><th className={th}>{L("By", "ដោយ")}</th><th className={`${th} text-right`}>{L("Balance after", "សមតុល្យក្រោយ")}</th>{canEdit && <th className={th}></th>}</tr></thead>
            <tbody>
              {shownTx.length === 0 && <tr><td colSpan={10} className="p-6 text-center text-slate-500">{L("No records.", "គ្មានកំណត់ត្រា។")}</td></tr>}
              {shownTx.map((x) => { const i = itemById[x.itemId] || { name: "(deleted)", unit: "" }; return (
                <tr key={x.id} className="border-t border-slate-100 dark:border-[#1d1d1d]">
                  <td className={`${td} font-mono`}>{dmy(x.date)}</td><td className={`${td} font-bold`}>{i.name}</td>
                  <td className={td}><span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${x.type === "IN" ? "bg-emerald-500/15 text-emerald-700 dark:text-emerald-300" : "bg-rose-500/15 text-rose-700 dark:text-rose-300"}`}>{x.type}</span></td>
                  <td className={`${td} text-right tabular-nums font-bold`}>{x.type === "IN" ? "+" : "−"}{x.qty} {i.unit}</td><td className={`${td} font-mono`}>{x.ref}</td><td className={td}>{x.party}</td><td className={`${td} max-w-[200px] truncate`}>{x.note}</td><td className={td}>{x.by}</td>
                  <td className={`${td} text-right tabular-nums`}>{after[x.id]}</td>
                  {canEdit && <td className={`${td} text-right`}><button onClick={() => setTxForm({ ...x })} className="px-1.5 text-slate-500 hover:text-blue-600"><Icon name="Pencil" size={13} /></button><button onClick={() => delTx(x.id)} className="px-1.5 text-slate-500 hover:text-rose-600"><Icon name="Trash2" size={13} /></button></td>}
                </tr>); })}
            </tbody>
          </table>
        </div>
      )}

      {itemForm && (
        <Modal title={itemForm.id ? L("Edit item", "កែសម្ភារ") : L("New item", "សម្ភារថ្មី")} onClose={() => setItemForm(null)} width="max-w-lg">
          <form onSubmit={saveItem} className="space-y-3">
            <div className="grid grid-cols-2 gap-2">
              <Field label="Code"><input value={itemForm.code} className={`${INPUT} font-mono uppercase`} placeholder="MAT-010" onChange={(e) => setItemForm({ ...itemForm, code: e.target.value.toUpperCase() })} /></Field>
              <Field label={L("Category", "ប្រភេទ")}><input list="stk-cat" value={itemForm.category} className={INPUT} onChange={(e) => setItemForm({ ...itemForm, category: e.target.value })} /><datalist id="stk-cat">{cats.map((c) => <option key={c} value={c} />)}</datalist></Field>
            </div>
            <Field label={L("Item name *", "ឈ្មោះសម្ភារ *")}><input required value={itemForm.name} className={INPUT} onChange={(e) => setItemForm({ ...itemForm, name: e.target.value })} /></Field>
            <div className="grid grid-cols-3 gap-2">
              <Field label={L("Unit", "ឯកតា")}><input value={itemForm.unit} className={INPUT} placeholder="bag, m3, pcs" onChange={(e) => setItemForm({ ...itemForm, unit: e.target.value })} /></Field>
              <Field label={L("Opening stock", "ស្តុកដើមគ្រា")}><input type="number" value={itemForm.opening} className={INPUT} onChange={(e) => setItemForm({ ...itemForm, opening: e.target.value })} /></Field>
              <Field label={L("Min. level", "កម្រិតអប្បបរមា")}><input type="number" value={itemForm.min} className={INPUT} onChange={(e) => setItemForm({ ...itemForm, min: e.target.value })} /></Field>
            </div>
            <Field label={L("Location", "ទីតាំងរក្សាទុក")}><input value={itemForm.location} className={INPUT} onChange={(e) => setItemForm({ ...itemForm, location: e.target.value })} /></Field>
            <div className="flex justify-end gap-2 pt-2 border-t border-inherit"><button type="button" onClick={() => setItemForm(null)} className="px-3 py-1.5 rounded border border-inherit">{L("Cancel", "បោះបង់")}</button><button type="submit" className="px-4 py-1.5 rounded bg-blue-600 text-white font-bold">{L("Save", "រក្សាទុក")}</button></div>
          </form>
        </Modal>
      )}
      {txForm && (
        <Modal title={`${txForm.type === "IN" ? "⬇ " + L("Stock IN", "ទទួលចូល") : "⬆ " + L("Stock OUT", "ចេញប្រើ")}`} onClose={() => setTxForm(null)} width="max-w-lg">
          <form onSubmit={saveTx} className="space-y-3">
            <div className="flex gap-1.5">{["IN", "OUT"].map((k) => <button type="button" key={k} onClick={() => setTxForm({ ...txForm, type: k })} className={`flex-1 py-1.5 rounded-md text-xs font-bold border ${txForm.type === k ? (k === "IN" ? "bg-emerald-600 text-white border-emerald-600" : "bg-rose-600 text-white border-rose-600") : "border-slate-300 dark:border-[#333]"}`}>{k === "IN" ? L("IN (receive)", "ចូល (ទទួល)") : L("OUT (issue / use)", "ចេញ (ប្រើ)")}</button>)}</div>
            <div className="grid grid-cols-2 gap-2">
              <Field label={L("Date", "ថ្ងៃ")}><input type="date" required value={txForm.date} className={INPUT} onChange={(e) => setTxForm({ ...txForm, date: e.target.value })} /></Field>
              <Field label="Ref No. (PO / DO / MR)"><input value={txForm.ref} className={`${INPUT} font-mono uppercase`} onChange={(e) => setTxForm({ ...txForm, ref: e.target.value.toUpperCase() })} /></Field>
            </div>
            <Field label={L("Item *", "សម្ភារ *")}>
              <select required value={txForm.itemId} className={INPUT} onChange={(e) => setTxForm({ ...txForm, itemId: e.target.value })}>{items.map((i) => <option key={i.id} value={i.id}>{i.code} · {i.name} ({L("balance", "សមតុល្យ")} {bal(i)} {i.unit})</option>)}</select>
            </Field>
            <Field label={`${L("Quantity", "បរិមាណ")} *${itemById[txForm.itemId] ? " (" + itemById[txForm.itemId].unit + ")" : ""}`}><input type="number" min="0" step="any" required value={txForm.qty} className={INPUT} onChange={(e) => setTxForm({ ...txForm, qty: e.target.value })} /></Field>
            <Field label={txForm.type === "IN" ? L("Supplier / received from", "អ្នកផ្គត់ផ្គង់ / ទទួលពី") : L("Issued to / used for", "ចេញទៅ / ប្រើសម្រាប់")}><input value={txForm.party} className={INPUT} onChange={(e) => setTxForm({ ...txForm, party: e.target.value })} /></Field>
            <div className="grid grid-cols-2 gap-2">
              <Field label={L("Note", "កំណត់សម្គាល់")}><input value={txForm.note} className={INPUT} onChange={(e) => setTxForm({ ...txForm, note: e.target.value })} /></Field>
              <Field label={L("Recorded by", "កត់ត្រាដោយ")}><input value={txForm.by} className={INPUT} onChange={(e) => setTxForm({ ...txForm, by: e.target.value })} /></Field>
            </div>
            <div className="flex justify-end gap-2 pt-2 border-t border-inherit"><button type="button" onClick={() => setTxForm(null)} className="px-3 py-1.5 rounded border border-inherit">{L("Cancel", "បោះបង់")}</button><button type="submit" className="px-4 py-1.5 rounded bg-blue-600 text-white font-bold">{L("Save", "រក្សាទុក")}</button></div>
          </form>
        </Modal>
      )}
    </div>
  );
}

/* =====================================================================
   REQUISITION: តាមដានសំណើ (Purchase / Material / Sub-Con / Prepare / General Request)
   - សំណើអ្វី, ថ្ងៃណា, ដល់អ្នកណា, ត្រូវការនៅថ្ងៃណា, ស្ថានភាព, ថ្ងៃ Close, ចំនួនថ្ងៃដែលបើក
   ===================================================================== */
const REQ_TYPES = [
  { key: "Purchase Request", km: "ស្នើសុំទិញ", pre: "PR", color: "#3B5BDB" },
  { key: "Material Request", km: "ស្នើសុំសម្ភារ", pre: "MR", color: "#059669" },
  { key: "Sub-Con Request", km: "ស្នើសុំម៉ៅការបន្ត", pre: "SC", color: "#F59E0B" },
  { key: "Prepare Request", km: "រៀបចំលិខិតស្នើសុំ", pre: "PP", color: "#8B5CF6" },
  { key: "General Request", km: "លិខិតស្នើសុំទូទៅ", pre: "GR", color: "#64748B" },
];
const REQ_STATUS = {
  "Open": { km: "បើក", cls: "bg-blue-500/15 text-blue-700 dark:text-blue-300" },
  "Submitted": { km: "បានដាក់ស្នើ", cls: "bg-sky-500/15 text-sky-700 dark:text-sky-300" },
  "Approved": { km: "បានអនុម័ត", cls: "bg-emerald-500/15 text-emerald-700 dark:text-emerald-300" },
  "In Progress": { km: "កំពុងដំណើរការ", cls: "bg-amber-500/20 text-amber-700 dark:text-amber-300" },
  "Closed": { km: "បិទរួច", cls: "bg-slate-500/20 text-slate-700 dark:text-slate-200" },
  "Rejected": { km: "បដិសេធ", cls: "bg-rose-500/15 text-rose-700 dark:text-rose-300" },
};
const DEFAULT_REQ = [
  { id: "q1", ref: "PR-001", type: "Purchase Request", title: "Rebar D16 — 10 ton for Pier P3", requestedBy: "Eng. Sokha", date: addDaysISO(-12), to: "Procurement Manager", needBy: addDaysISO(-2), status: "In Progress", closeDate: "", note: "Supplier quotation received" },
  { id: "q2", ref: "MR-001", type: "Material Request", title: "Cement 200 bags", requestedBy: "Eng. Vanna", date: addDaysISO(-9), to: "Warehouse", needBy: addDaysISO(-6), status: "Closed", closeDate: addDaysISO(-6), note: "" },
  { id: "q3", ref: "SC-001", type: "Sub-Con Request", title: "Precast girder installation crew", requestedBy: "Eng. Sokha", date: addDaysISO(-3), to: "Project Manager", needBy: addDaysISO(10), status: "Submitted", closeDate: "", note: "" },
];
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);

function RequestTracker({ items, onSave, canEdit, isKm, userName }) {
  const L = (en, km) => (isKm ? km : en);
  const [fType, setFType] = useState("ALL");
  const [fStatus, setFStatus] = useState("ALL");
  const [q, setQ] = useState("");
  const [form, setForm] = useState(null);
  const today = todayISO();
  const typeOf = (k) => REQ_TYPES.find((t) => t.key === k) || REQ_TYPES[4];
  const isDone = (r) => r.status === "Closed" || r.status === "Rejected";
  const overdueDays = (r) => (!isDone(r) && r.needBy && r.needBy < today ? daysBetween(r.needBy, today) : 0);
  const openDays = (r) => daysBetween(r.date, isDone(r) && r.closeDate ? r.closeDate : today);
  const nextRef = (type) => { const p = typeOf(type).pre; const n = items.filter((r) => r.ref.startsWith(p + "-")).map((r) => Number(r.ref.split("-")[1]) || 0); return `${p}-${String(Math.max(0, ...n) + 1).padStart(3, "0")}`; };
  const shown = items.filter((r) => (fType === "ALL" || r.type === fType) && (fStatus === "ALL" || (fStatus === "ACTIVE" ? !isDone(r) : fStatus === "OVERDUE" ? overdueDays(r) > 0 : r.status === fStatus))
    && `${r.ref} ${r.title} ${r.requestedBy} ${r.to} ${r.note}`.toLowerCase().includes(q.toLowerCase())).sort((a, b) => b.date.localeCompare(a.date) || b.ref.localeCompare(a.ref));
  const total = items.length, active = items.filter((r) => !isDone(r)).length, overdue = items.filter((r) => overdueDays(r) > 0).length, closed = items.filter((r) => r.status === "Closed");
  const avgClose = closed.length ? Math.round(closed.reduce((a, r) => a + openDays(r), 0) / closed.length) : 0;

  const setStatus = (id, status) => onSave(items.map((r) => (r.id === id ? { ...r, status, closeDate: status === "Closed" || status === "Rejected" ? (r.closeDate || today) : "" } : r)));
  const openNew = (type = "Purchase Request") => setForm({ id: "", ref: nextRef(type), type, title: "", requestedBy: userName || "", date: today, to: "", needBy: "", status: "Open", closeDate: "", note: "" });
  const submit = (e) => {
    e.preventDefault();
    const f = { ...form, ref: form.ref.trim().toUpperCase() };
    if (!f.title.trim() || !f.ref) return;
    if (items.some((r) => r.id !== f.id && r.ref.toUpperCase() === f.ref)) return alert(L("This Ref No. already exists: ", "លេខ Ref នេះមានរួចហើយ៖ ") + f.ref);
    if (isDone(f) && !f.closeDate) f.closeDate = today;
    if (!isDone(f)) f.closeDate = "";
    onSave(f.id ? items.map((r) => (r.id === f.id ? f : r)) : [{ ...f, id: msId() }, ...items]);
    setForm(null);
  };
  const del = (r) => { if (window.confirm(L(`Delete ${r.ref}?`, `លុប ${r.ref}?`))) onSave(items.filter((x) => x.id !== r.id)); };
  const th = "py-2 px-2 text-[10px] font-bold uppercase whitespace-nowrap text-slate-600 dark:text-slate-300 text-left";
  const td = "py-1.5 px-2 align-top";
  const stat = (lb, v, c, k) => <button onClick={() => setFStatus(k)} className={`text-left p-2.5 rounded-xl border bg-slate-50/60 dark:bg-slate-900/50 ${fStatus === k ? "border-blue-500" : "border-slate-200 dark:border-[#222]"}`}><div className="text-[10px] font-bold uppercase text-slate-500">{lb}</div><div className="text-2xl font-black tabular-nums" style={{ color: c }}>{v}</div></button>;

  return (
    <div className="space-y-4">
      <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
        <div>
          <h3 className="text-base font-black uppercase">{L("Requisition Tracking", "តាមដានលិខិតស្នើសុំ")}</h3>
          <p className="text-[11px] text-slate-500 dark:text-slate-400">{L("What was requested, when, to whom, needed by when, and when it was closed.", "ស្នើសុំអ្វី ពេលណា ដល់អ្នកណា ត្រូវការនៅពេលណា និងបិទនៅថ្ងៃណា។")}</p>
        </div>
        {canEdit && <button onClick={() => openNew(fType !== "ALL" ? fType : "Purchase Request")} className="px-3 py-1.5 rounded-md text-xs font-bold bg-blue-600 text-white self-start">＋ {L("New request", "សំណើថ្មី")}</button>}
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        {stat(L("Total requests", "សំណើសរុប"), total, "#3B5BDB", "ALL")}
        {stat(L("Open / active", "កំពុងបើក"), active, "#F59E0B", "ACTIVE")}
        {stat(L("Overdue", "ហួសកំណត់"), overdue, overdue ? "#E11D48" : "#059669", "OVERDUE")}
        {stat(L("Avg. days to close", "ថ្ងៃជាមធ្យមដើម្បីបិទ"), avgClose, "#059669", "Closed")}
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2">
        {REQ_TYPES.map((t) => {
          const list = items.filter((r) => r.type === t.key), op = list.filter((r) => !isDone(r)).length;
          return (
            <button key={t.key} onClick={() => setFType(fType === t.key ? "ALL" : t.key)} className={`text-left p-2.5 rounded-xl border relative overflow-hidden ${fType === t.key ? "border-blue-500 bg-blue-500/5" : "border-slate-200 dark:border-[#222]"}`}>
              <div className="absolute inset-x-0 top-0 h-[3px]" style={{ background: t.color }} />
              <div className="text-[10px] font-bold uppercase truncate" style={{ color: t.color }}>{isKm ? t.km : t.key}</div>
              <div className="text-xs mt-1"><span className="text-xl font-black tabular-nums">{op}</span> <span className="text-slate-500">{L("open", "បើក")} / {list.length}</span></div>
            </button>
          );
        })}
      </div>

      <div className="flex flex-wrap items-center gap-2">
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder={L("Search ref, request, name…", "ស្វែងរក Ref, សំណើ, ឈ្មោះ…")} className={`${INPUT} !w-56`} />
        <select value={fStatus} onChange={(e) => setFStatus(e.target.value)} className={`${INPUT} !w-40`}>
          <option value="ALL">{L("All status", "គ្រប់ស្ថានភាព")}</option><option value="ACTIVE">{L("Active only", "កំពុងបើក")}</option><option value="OVERDUE">{L("Overdue", "ហួសកំណត់")}</option>
          {Object.keys(REQ_STATUS).map((s) => <option key={s} value={s}>{isKm ? REQ_STATUS[s].km : s}</option>)}
        </select>
        {(fType !== "ALL" || fStatus !== "ALL" || q) && <button onClick={() => { setFType("ALL"); setFStatus("ALL"); setQ(""); }} className="text-xs font-bold text-blue-600">{L("Clear filters", "សម្អាតតម្រង")}</button>}
      </div>

      <div className="overflow-x-auto rounded-lg border border-slate-200 dark:border-[#222]">
        <table className="w-full text-xs border-collapse">
          <thead><tr className="bg-slate-100 dark:bg-slate-900">
            <th className={th}>Ref No.</th><th className={th}>{L("Type", "ប្រភេទ")}</th><th className={`${th} min-w-[200px]`}>{L("Request (what)", "សំណើអ្វី")}</th><th className={th}>{L("Requested by", "ស្នើដោយ")}</th><th className={th}>{L("Date", "ថ្ងៃស្នើ")}</th>
            <th className={th}>{L("To (whom)", "ដល់អ្នកណា")}</th><th className={th}>{L("Needed by", "ត្រូវការនៅ")}</th><th className={th}>{L("Status", "ស្ថានភាព")}</th><th className={th}>{L("Closed on", "បិទនៅ")}</th><th className={`${th} text-right`}>{L("Days", "ថ្ងៃ")}</th>{canEdit && <th className={th}></th>}</tr></thead>
          <tbody>
            {shown.length === 0 && <tr><td colSpan={11} className="p-6 text-center text-slate-500">{L("No requests.", "គ្មានសំណើ។")}</td></tr>}
            {shown.map((r) => { const ty = typeOf(r.type), od = overdueDays(r); return (
              <tr key={r.id} className="border-t border-slate-100 dark:border-[#1d1d1d]">
                <td className={`${td} font-mono font-bold whitespace-nowrap`} style={{ color: ty.color }}>{r.ref}</td>
                <td className={`${td} whitespace-nowrap`}><span className="inline-block w-2 h-2 rounded-full mr-1.5" style={{ background: ty.color }} />{isKm ? ty.km : r.type}</td>
                <td className={td}><div className="font-bold">{r.title}</div>{r.note && <div className="text-[10px] text-slate-500 dark:text-slate-400">{r.note}</div>}</td>
                <td className={`${td} whitespace-nowrap`}>{r.requestedBy}</td><td className={`${td} font-mono whitespace-nowrap`}>{dmy(r.date)}</td><td className={`${td} whitespace-nowrap`}>{r.to}</td>
                <td className={`${td} font-mono whitespace-nowrap`}>{dmy(r.needBy)}{od > 0 && <span className="ml-1 px-1.5 py-0.5 rounded-full bg-rose-600 text-white text-[9px] font-bold">+{od}d</span>}</td>
                <td className={`${td} whitespace-nowrap`}>
                  {canEdit ? <select value={r.status} onChange={(e) => setStatus(r.id, e.target.value)} className={`px-2 py-1 rounded-full text-[10px] font-bold border-0 ${REQ_STATUS[r.status].cls}`}>{Object.keys(REQ_STATUS).map((s) => <option key={s} value={s}>{isKm ? REQ_STATUS[s].km : s}</option>)}</select>
                    : <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${REQ_STATUS[r.status].cls}`}>{isKm ? REQ_STATUS[r.status].km : r.status}</span>}
                </td>
                <td className={`${td} font-mono whitespace-nowrap`}>{dmy(r.closeDate)}</td>
                <td className={`${td} text-right tabular-nums font-bold`}>{openDays(r)}</td>
                {canEdit && <td className={`${td} whitespace-nowrap`}><button onClick={() => setForm({ ...r })} className="px-1.5 text-slate-500 hover:text-blue-600"><Icon name="Pencil" size={13} /></button><button onClick={() => del(r)} className="px-1.5 text-slate-500 hover:text-rose-600"><Icon name="Trash2" size={13} /></button></td>}
              </tr>); })}
          </tbody>
        </table>
      </div>

      {form && (
        <Modal title={form.id ? L("Edit request", "កែសំណើ") : L("New request", "សំណើថ្មី")} onClose={() => setForm(null)} width="max-w-xl">
          <form onSubmit={submit} className="space-y-3">
            <div className="grid grid-cols-2 gap-2">
              <Field label={L("Request type", "ប្រភេទសំណើ")}><select value={form.type} className={INPUT} onChange={(e) => setForm({ ...form, type: e.target.value, ref: form.id ? form.ref : nextRef(e.target.value) })}>{REQ_TYPES.map((t) => <option key={t.key} value={t.key}>{isKm ? t.km : t.key}</option>)}</select></Field>
              <Field label="Ref No."><input required value={form.ref} className={`${INPUT} font-mono uppercase`} onChange={(e) => setForm({ ...form, ref: e.target.value.toUpperCase() })} /></Field>
            </div>
            <Field label={L("Request (what) *", "សំណើអ្វី *")}><input required value={form.title} className={INPUT} placeholder={L("e.g. Rebar D16 — 10 ton", "ឧ. ដែក D16 — 10 តោន")} onChange={(e) => setForm({ ...form, title: e.target.value })} /></Field>
            <div className="grid grid-cols-2 gap-2">
              <Field label={L("Requested by", "ស្នើដោយ")}><input value={form.requestedBy} className={INPUT} onChange={(e) => setForm({ ...form, requestedBy: e.target.value })} /></Field>
              <Field label={L("To (whom)", "ដល់អ្នកណា")}><input value={form.to} className={INPUT} placeholder="Procurement / PM / Warehouse" onChange={(e) => setForm({ ...form, to: e.target.value })} /></Field>
              <Field label={L("Request date", "ថ្ងៃស្នើ")}><input type="date" required value={form.date} className={INPUT} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
              <Field label={L("Needed by", "ត្រូវការនៅថ្ងៃ")}><input type="date" value={form.needBy} className={INPUT} onChange={(e) => setForm({ ...form, needBy: e.target.value })} /></Field>
              <Field label={L("Status", "ស្ថានភាព")}><select value={form.status} className={INPUT} onChange={(e) => setForm({ ...form, status: e.target.value, closeDate: e.target.value === "Closed" || e.target.value === "Rejected" ? (form.closeDate || today) : "" })}>{Object.keys(REQ_STATUS).map((s) => <option key={s} value={s}>{isKm ? REQ_STATUS[s].km : s}</option>)}</select></Field>
              <Field label={L("Closed on", "ថ្ងៃបិទ")}><input type="date" value={form.closeDate} disabled={!(form.status === "Closed" || form.status === "Rejected")} className={INPUT} onChange={(e) => setForm({ ...form, closeDate: e.target.value })} /></Field>
            </div>
            <Field label={L("Remark", "កំណត់សម្គាល់")}><textarea rows={2} value={form.note} className={INPUT} onChange={(e) => setForm({ ...form, note: e.target.value })} /></Field>
            <div className="flex justify-end gap-2 pt-2 border-t border-inherit"><button type="button" onClick={() => setForm(null)} className="px-3 py-1.5 rounded border border-inherit">{L("Cancel", "បោះបង់")}</button><button type="submit" className="px-4 py-1.5 rounded bg-blue-600 text-white font-bold">{L("Save", "រក្សាទុក")}</button></div>
          </form>
        </Modal>
      )}
    </div>
  );
}

function App() {
  /* ---------- ក. State (ទិន្នន័យដែលផ្លាស់ប្តូរបាន) ---------- */
  const [lang, setLang] = useState("en");               // ភាសា: "en" ឬ "km"
  const [theme, setTheme] = useState("light");          // ពន្លឺ: "light" ឬ "dark"
  const [demoRole, setDemoRole] = useState("admin");  // Demo Mode: ប្តូរតួនាទីដោយដៃ
  const [session, setSession] = useState(null);         // Google session (Cloud Mode)
  const [profile, setProfile] = useState(null);         // ជួរក្នុងតារាង profiles: role = pending | staff | admin
  // Cloud Mode: តួនាទីមកពី profiles (មិនទាន់ Login ឬ pending = "viewer" មើលបានតែ Dashboard)
  const role = sb ? (profile?.role === "admin" ? "admin" : profile?.role === "staff" ? "staff" : "viewer") : demoRole;
  const [activeTab, setActiveTab] = useState("dashboard"); // ទំព័រដែលកំពុងបើក
  const [activeSub, setActiveSub] = useState("");       // Sub-Folder ដែលកំពុងជ្រើស
  const [modal, setModal] = useState(null);             // Popup ដែលកំពុងបើក: "login" | "permissions" | "upload" | "editDash" | null
  const [accessDenied, setAccessDenied] = useState(false); // បង្ហាញបដាក្រហម "ហាមឃាត់"
  const [sidebarOpen, setSidebarOpen] = useState(() => window.innerWidth >= 1024); // Sidebar: Desktop បើក, ទូរស័ព្ទ/Tablet បិទជាមុន

  const [users, setUsers] = useState(sb ? [] : INITIAL_USERS);
  const [currentUser, setCurrentUser] = useState(sb ? GUEST : INITIAL_USERS[0]);
  const [permissions, setPermissions] = usePersist("tia-perm", INITIAL_PERMISSIONS); // Demo Mode: សិទ្ធិរួមសម្រាប់ Staff ទាំងអស់
  const [permUserId, setPermUserId] = useState(null); // Cloud Mode: អ្នកប្រើដែល Admin កំពុងកែសិទ្ធិ

  const [documents, setDocuments] = usePersist("tia-docs", initialDocuments);
  const [data, setData] = usePersist("tia-data", { machinery: initialMachineryList, manpower: initialManpowerList, milestones: initialMasterScheduleItems, weekly: initialWeeklyPerfData });
  const [photos, setPhotos] = usePersist("tia-photos", droneImages);  // រូប Drone (អតិបរមា ១០)
  const [editing, setEditing] = useState(null);          // តារាងដែលកំពុងកែ: "machinery" | "manpower" | "milestones" | "weekly" | null
  const [newFile, setNewFile] = useState(null);          // File ដែលបានជ្រើសពី PC
  const [sCurve, setSCurve] = usePersist("tia-scurve", initialSCurveData);
  // % ការងារសម្រេចបាន = Actual នៃខែចុងក្រោយដែលមានទិន្នន័យ (>0) ក្នុង S-Curve → Auto update
  const lastActual = [...sCurve].reverse().find((d) => Number(d.actual) > 0);
  const completePct = lastActual ? Math.round(Number(lastActual.actual) * 10) / 10 : 0;
  const completeMonth = lastActual ? lastActual.month : "";
  const [dates, setDates] = usePersist("tia-dates", { startDate: "2026-05-01", endDate: "2026-12-31" });
  const [calEvents, setCalEvents] = usePersist("tia-calendar", DEFAULT_CAL);   // Leave & To-Do Calendar
  const [stock, setStock] = usePersist("tia-stock", DEFAULT_STOCK);              // Warehouse: items + transactions
  const [requests, setRequests] = usePersist("tia-requests", DEFAULT_REQ);        // Requisition tracking
  const [zoomChart, setZoomChart] = useState(false);                              // Zoom S-Curve
  const [report, setReport] = useState(false);                                    // Daily Report (Print/PDF)
  const [master, setMaster] = usePersist("tia-master", DEFAULT_MASTER);   // Master Construction Schedule (វាយដោយដៃ)
  const [trackerManual, setTrackerManual] = usePersist("tia-trackers", { RFI: "", RFA: "", SI: "", NCR: "" }); // លេខ RFI/RFA/SI/NCR បញ្ចូលដោយដៃ ("" = រាប់ស្វ័យប្រវត្តិ)

  const [filters, setFilters] = useState({ search: "", format: "ALL", status: "ALL", sort: "DATE_DESC" });
  const [newDoc, setNewDoc] = useState(EMPTY_DOC_FORM);  // Form បញ្ចូលឯកសារថ្មី
  const [editForm, setEditForm] = useState(null);        // Form កែប្រែ Dashboard (ចម្លងពេលបើក)

  /* ---------- ខ. តម្លៃដែលគណនាពី State ---------- */
  const t = { ...translations[lang], ...EXTRA[lang] };   // អត្ថបទតាមភាសាបច្ចុប្បន្ន
  const isAdmin = role === "admin";
  const isKm = lang === "km";

  /* ---------- ស្ថិតិ: អ្នកកំពុងអនឡាញ (Realtime Presence) និងចំនួនចូលមើលសរុប ---------- */
  const [online, setOnline] = useState(1);    // ចំនួនអ្នក/Tab ដែលកំពុងបើក website ពេលនេះ
  const [stats, setStats] = useState({ visitors: null, visits: null }); // visitors = ចំនួនអ្នកចូលមើល (ម្នាក់រាប់ម្តង/Browser), visits = ចំនួនដងចូលមើល (រាប់ម្តងក្នុង ១ session)
  useEffect(() => {
    const counted = sessionStorage.getItem("tia-visit-counted");
    sessionStorage.setItem("tia-visit-counted", "1");
    // ID អ្នកចូលមើល (ផ្ទុកក្នុង Browser): អ្នកដដែលចូលម្តងទៀត មិនរាប់ជា Visitor ថ្មីទេ
    let vid = localStorage.getItem("tia-visitor-id");
    if (!vid) { vid = window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2); localStorage.setItem("tia-visitor-id", vid); }

    if (!sb) {
      const n = Number(localStorage.getItem("tia-visits") || 0) + (counted ? 0 : 1); // Demo: រាប់ក្នុង Browser នេះតែប៉ុណ្ណោះ
      localStorage.setItem("tia-visits", n);
      setStats({ visitors: 1, visits: n });
      return;
    }
    const num = (v) => (v == null ? null : Number(v));
    (async () => {
      try {
        if (!counted) {                                    // session ថ្មី: កត់ត្រាតាម Supabase function track_visitor
          const { data, error } = await sb.rpc("track_visitor", { vid });
          if (!error && data) return setStats({ visitors: num(data.visitors), visits: num(data.visits) });
        } else {                                           // refresh: អានតែលេខ
          const { data } = await sb.from("site_stats").select("key,value").in("key", ["visitors", "visits"]);
          if (data && data.length) {
            const m = Object.fromEntries(data.map((r) => [r.key, Number(r.value)]));
            return setStats({ visitors: m.visitors ?? null, visits: m.visits ?? null });
          }
        }
      } catch (e) { /* បន្តទៅ fallback */ }
      // Fallback (មិនទាន់រត់ SQL ថ្មី): ប្រើ track_visit ចាស់ → បង្ហាញតែ Visits
      const q = counted ? await sb.from("site_stats").select("value").eq("key", "visits").maybeSingle().then(({ data }) => data && data.value)
                        : await sb.rpc("track_visit").then(({ data }) => data);
      if (q != null) setStats({ visitors: null, visits: Number(q) });
    })();
    // អ្នកកំពុងអនឡាញ: ម្នាក់ៗមាន key ផ្ទាល់ខ្លួន ហើយ Supabase រាប់ចំនួនដែលភ្ជាប់ក្នុងពេលតែមួយ
    const key = vid + "-" + Math.random().toString(36).slice(2, 8);
    const channel = sb.channel("tia-online", { config: { presence: { key } } });
    channel.on("presence", { event: "sync" }, () => setOnline(Object.keys(channel.presenceState()).length))
      .subscribe((status) => { if (status === "SUBSCRIBED") channel.track({ at: Date.now() }); });
    return () => { sb.removeChannel(channel); };
  }, []);

  /* ---------- Supabase Auth: Google Login, តួនាទី, បញ្ជីអ្នកប្រើ ---------- */
  // ១) តាមដាន session
  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: { subscription } } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => subscription.unsubscribe();
  }, []);
  // ២) អាន profile របស់ខ្លួន (role: pending | staff | admin)
  useEffect(() => {
    if (!sb) return;
    if (!session) return setProfile(null);
    const loadProfile = async () => {
      let { data } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
      // បើ profile មិនទាន់មាន (ឧ. Login មុនពេលរត់ SQL) ឲ្យបង្កើតខ្លួនឯងជា pending
      if (!data) {
        const u = session.user, meta = u.user_metadata || {};
        ({ data } = await sb.from("profiles")
          .insert({ id: u.id, email: u.email, name: meta.full_name || u.email, photo: meta.avatar_url || null, role: "pending" })
          .select().maybeSingle());
      }
      setProfile(data);
      // ជូនដំណឹងអ្នកចុះឈ្មោះថ្មី (ម្តងក្នុងមួយ session ដើម្បីកុំរំខាន; ក្រៅពីនេះមានបដាលឿងជានិច្ច)
      if (data && data.role === "pending" && !sessionStorage.getItem("tia-pending-alert")) {
        sessionStorage.setItem("tia-pending-alert", "1");
        alert("សូមអរគុណសម្រាប់ការចុះឈ្មោះ! គណនីរបស់អ្នកស្ថិតក្នុងស្ថានភាពរង់ចាំការអនុម័តពី Admin។ សូមរង់ចាំការផ្ទៀងផ្ទាត់។\n\nThank you for registering! Your account is waiting for Admin approval.");
      }
    };
    loadProfile();
  }, [session]);
  // ៣) បង្ហាញឈ្មោះ/រូបអ្នកប្រើនៅ Sidebar
  useEffect(() => {
    if (!sb) return;
    setCurrentUser(profile
      ? { id: profile.id, name: profile.name || profile.email, email: profile.email, photo: profile.photo || GUEST_PHOTO, status: profile.role === "pending" ? "pending" : "approved" }
      : GUEST);
  }, [profile]);
  // ៤) Admin ទាញបញ្ជីអ្នកប្រើទាំងអស់ (សម្រាប់អនុម័ត)
  useEffect(() => {
    if (!sb || !isAdmin) return;
    sb.from("profiles").select("*").order("created_at").then(({ data }) => setUsers((data || []).map((p) => ({
      id: p.id, name: p.name || p.email, email: p.email, photo: p.photo || GUEST_PHOTO,
      role: p.role === "admin" ? "admin" : "staff", status: p.role === "pending" ? "pending" : "approved", perms: p.perms || {},
    }))));
  }, [isAdmin]);

  // Night Mode: ដាក់/ដក class "dark" លើ <html>
  useEffect(() => {
    document.documentElement.classList.toggle("dark", theme === "dark");
  }, [theme]);

  // គណនាចំនួនថ្ងៃ: សរុប / កន្លងផុត / នៅសល់
  const DAY = 1000 * 60 * 60 * 24;
  const start = new Date(dates.startDate);
  const end = new Date(dates.endDate);
  const totalDays = Math.max(1, Math.ceil((end - start) / DAY));
  const daysElapsed = Math.min(totalDays, Math.max(0, Math.ceil((TODAY - start) / DAY)));
  const remainingDays = totalDays - daysElapsed;

  // បុគ្គលិកចូលមើលបានតែផ្នែកដែល Admin បានអនុញ្ញាត (Admin មើលបានទាំងអស់)
  const myPerms = sb ? (profile?.perms || {}) : permissions; // សិទ្ធិរបស់អ្នកដែលកំពុងប្រើ
  const canAccess = (key) => isAdmin || key === "dashboard" || (role === "staff" && myPerms[key]);
  // Admin កែបានទាំងអស់; Staff កែបានតែពេល Admin អនុញ្ញាត (permissions.canEdit); Viewer កែមិនបាន
  const canEditData = isAdmin || (role === "staff" && myPerms.canEdit);
  const editBtn = (key) => canEditData && (
    <button onClick={() => setEditing(key)} className="px-2 py-0.5 rounded bg-blue-600 text-white text-[10px] font-bold">{t.edit}</button>
  );
  const currentCategory = categories.find((c) => c.key === activeTab);

  // រាប់ RFI / RFA / SI / NCR ស្វ័យប្រវត្តិពីបញ្ជីឯកសារ
  const countType = (folder, word) =>
    documents.filter((d) => d.subFolder === folder || (d.category === "catRfiNcr" && d.name.includes(word))).length;

  // លេខ RFI/RFA/SI/NCR: បើបញ្ចូលដោយដៃ ប្រើលេខនោះ បើទទេ រាប់ស្វ័យប្រវត្តិពីឯកសារ
  const isManual = (k) => trackerManual[k] !== "" && trackerManual[k] != null;
  const trackerCount = (k) => (isManual(k) ? Number(trackerManual[k]) : countType(k + " Folder", k));

  // លេខ DOC # ស្វ័យប្រវត្តិ: រាប់តាមលំដាប់ Upload (DOC-0001, 0002, ...) ហើយរាប់ឡើងវិញដោយខ្លួនឯង ពេលលុបឯកសារ
  // ឯកសារចាស់ (DOC-xxxx) នៅតែរាប់ស្វ័យប្រវត្តិ; ឯកសារដែលវាយលេខដោយដៃ (NTB-SPT-...) បង្ហាញតាមដែលបានវាយ
  const numbered = [...documents]
    .sort((a, b) => Number(a.id) - Number(b.id))
    .map((d, i) => ({ ...d, docNum: !d.docNum || /^DOC-\d+$/i.test(d.docNum) ? `DOC-${String(i + 1).padStart(4, "0")}` : d.docNum }));
  const totalDocs = numbered.filter((d) => canAccess(d.category)).length;   // ចំនួនឯកសារដែលមាននៅពេលនេះ

  // ចម្រោះឯកសារ: តាមសិទ្ធិ → ប្រភេទ → Sub-Folder → ស្វែងរក → Format → Status → តម្រៀប
  const q = filters.search.toLowerCase();
  const filteredDocs = numbered
    .filter((d) => canAccess(d.category))
    .filter((d) => activeTab === "dashboard" || d.category === activeTab)
    .filter((d) => activeTab === "dashboard" || !activeSub || d.subFolder === activeSub)
    .filter((d) => d.name.toLowerCase().includes(q) || d.docNum.toLowerCase().includes(q))
    .filter((d) => filters.format === "ALL" || d.format === filters.format)
    .filter((d) => filters.status === "ALL" || d.status === filters.status)
    .sort(SORTERS[filters.sort]);

  // ឯកសារថ្មីៗ ៥ ចុងក្រោយ: តម្រៀបតាមថ្ងៃ Upload ថ្មីបំផុតមុន (មិនប៉ះពាល់ដោយការជ្រើស Sort ក្នុងទំព័រឯកសារ)
  const recentDocs = numbered
    .filter((d) => canAccess(d.category))
    .filter((d) => d.name.toLowerCase().includes(q) || d.docNum.toLowerCase().includes(q))
    .sort((a, b) => (new Date(b.date) - new Date(a.date)) || (Number(b.id) - Number(a.id)))
    .slice(0, 5);

  /* ---------- គ. Function សកម្មភាព (ពេលអ្នកប្រើចុចប៊ូតុង) ---------- */

  // បង្ហាញបដា "ហាមឃាត់" ៤ វិនាទី
  const flashAccessDenied = () => {
    setAccessDenied(true);
    setTimeout(() => setAccessDenied(false), 4000);
  };

  // ចុចលើម៉ឺនុយខាងឆ្វេង
  const selectTab = (key) => {
    if (!canAccess(key)) return flashAccessDenied();
    if (window.innerWidth < 1024) setSidebarOpen(false); // ទូរស័ព្ទ/Tablet: បិទ Sidebar បន្ទាប់ពីជ្រើស
    setActiveTab(key);
    const cat = categories.find((c) => c.key === key);
    setActiveSub(cat && cat.subFolders.length > 0 ? cat.subFolders[0] : "");
  };

  // បញ្ចូលឯកសារថ្មី (ដាក់ពីលើគេក្នុងបញ្ជី)
  const uploadDocument = (e) => {
    e.preventDefault();
    if (!newDoc.name.trim() || !newFile) return;
    const cat = categories.find((c) => c.key === newDoc.category);
    const docNum = newDoc.docNum.trim().replace(/\s+/g, "").toUpperCase();   // លេខឯកសារវាយដោយដៃ ឧ. NTB-SPT-BP-SD-STR-0001-V00
    if (!docNum) return alert(isKm ? "សូមវាយលេខឯកសារ (Document No.)" : "Please enter the Document No.");
    if (numbered.some((d) => d.docNum.toUpperCase() === docNum)) return alert((isKm ? "លេខឯកសារនេះមានរួចហើយ: " : "This Document No. already exists: ") + docNum);
    const created = {
      id: String(Date.now()),
      ...newDoc,
      docNum,
      hubType: cat ? cat.label : "Document",
      date: new Date().toISOString().split("T")[0],
      by: currentUser.name,
      avatar: currentUser.photo,
      views: 1,
      downloads: 0,
      hasFile: true,
    };
    Promise.resolve(fileSave(created.id, newFile)).then((r) => r && r.error && alert("Upload failed: " + r.error.message));   // រក្សាទុក File ពិតក្នុង IndexedDB
    setNewFile(null);
    setDocuments([created, ...documents]);
    setNewDoc(EMPTY_DOC_FORM);
    setModal(null);
  };

  // បើក/ទាញយក File ដែលបាន Upload
  const openDoc = async (doc, download) => {
    const f = doc.hasFile && (await fileGet(doc.id));
    if (!f) return alert("Sample document – no file stored.");
    const url = URL.createObjectURL(f);
    if (download) { const a = document.createElement("a"); a.href = url; a.download = f.name || doc.name; a.click(); } else window.open(url);
  };

  const deleteDocument = async (id) => {
    // Cloud Mode: លុប File ពិតពី Supabase Storage ផង (ច្បាប់ RLS អនុញ្ញាតតែ Admin) កុំឲ្យសល់ឯកសារស្រពោន ស៊ីទំហំ 1 GB
    const doc = documents.find((d) => d.id === id);
    if (sb && doc && doc.hasFile) await sb.storage.from("files").remove([id]);
    setDocuments(documents.filter((d) => d.id !== id));
  };

  // ចុះឈ្មោះតាម Google (ក្លែងធ្វើ) → ក្លាយជា "pending" រង់ចាំ Admin អនុម័ត
  const simulateGoogleLogin = () => {
    // Cloud Mode: Login ពិតតាម Google (ទំព័រនឹងប្តូរទៅ Google ហើយត្រឡប់មកវិញ)
    if (sb) return sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: window.location.origin + window.location.pathname } });
    const newUser = {
      id: String(Date.now()), name: "New Google User", email: "user.google@gmail.com",
      role: "staff", status: "pending", photo: photo("photo-1535713875002-d1d0cf377fde"),
    };
    setUsers([...users, newUser]);
    setCurrentUser(newUser);
    setDemoRole("viewer");
    setModal(null);
    flashAccessDenied();
  };

  const approveUser = async (id) => {
    // Cloud Mode: ប្តូរ role ក្នុង Database ពី pending → staff (ច្បាប់ RLS អនុញ្ញាតតែ Admin)
    if (sb) { const { error } = await sb.from("profiles").update({ role: "staff" }).eq("id", id); if (error) return alert(error.message); }
    setUsers(users.map((u) => (u.id === id ? { ...u, status: "approved" } : u)));
    setPermUserId(id); // ជ្រើសអ្នកនេះភ្លាម ដើម្បីកំណត់សិទ្ធិតាមផ្នែក
  };

  // ដកសិទ្ធិ: ប្តូរត្រឡប់ទៅ pending (អាច Approve ម្តងទៀតក្រោយ)
  const revokeUser = async (id) => {
    if (!window.confirm("Revoke access? This user will go back to Pending (Dashboard view only).")) return;
    if (sb) { const { error } = await sb.from("profiles").update({ role: "pending" }).eq("id", id); if (error) return alert(error.message); }
    setUsers(users.map((u) => (u.id === id ? { ...u, status: "pending" } : u)));
  };

  // បើក Form កែប្រែ Dashboard (ចម្លងតម្លៃបច្ចុប្បន្នមកកែ)
  const openEditDash = () => {
    setEditForm({ dates: { ...dates }, sCurve: sCurve.map((d) => ({ ...d })), trackers: { ...trackerManual } });
    setModal("editDash");
  };
  const saveEditDash = (e) => {
    e.preventDefault();
    setDates(editForm.dates);
    setSCurve(editForm.sCurve);
    setTrackerManual(editForm.trackers);
    setModal(null);
  };

  /* ---------- ឃ. ផ្នែកបង្ហាញ (UI) ---------- */

  // ក្រាប S-Curve: បម្លែងទិន្នន័យជាចំណុចក្នុង SVG (ទទឹង 500, កម្ពស់ 180)
  const xOf = (i) => (i * 500) / (sCurve.length - 1);
  const yOf = (value) => 180 - (value / 100) * 180;
  const linePoints = (key) => sCurve.map((d, i) => `${xOf(i)},${yOf(d[key])}`).join(" ");
  const ringPath = "M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831";

  // ===== របារចំហៀងខាងឆ្វេង (Sidebar) =====
  const sidebar = (
    <aside className={`fixed lg:static inset-y-0 left-0 z-40 w-64 max-w-[85vw] shrink-0 flex flex-col justify-between overflow-y-auto border-r bg-[#1B2A4E] border-[#152240] dark:bg-[#0A0A0A] dark:border-[#222] text-white transition-transform duration-200 ${sidebarOpen ? "translate-x-0" : "-translate-x-full lg:hidden"}`}>
      <div>
        <div className="p-4 border-b border-white/10 flex items-start justify-between gap-2">
          <div>
            <div className="font-bold text-sm uppercase text-blue-300">{t.companyName}</div>
            <div className="text-xs mt-0.5 text-slate-300">{t.projectName}</div>
          </div>
          {/* ប៊ូតុងបង្រួម Sidebar (ជ្រុងលើខាងស្តាំ) */}
          <button onClick={() => setSidebarOpen(false)} title="Collapse menu" className="p-1 rounded hover:bg-white/10 text-slate-300"><Icon name="ChevronLeft" size={18} /></button>
        </div>

        <div className="p-3 border-b border-white/10">
          <button onClick={() => selectTab("dashboard")}
            className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-bold ${activeTab === "dashboard" ? "bg-blue-600" : "text-slate-300 hover:bg-white/10"}`}>
            <Icon name="LayoutDashboard" size={18} /><span>{t.dashboard}</span>
          </button>
        </div>

        <div className="p-3 space-y-1">
          <div className="px-2 py-1.5 text-[10px] font-bold uppercase text-slate-400">{t.documents}</div>
          {categories.map((cat) => {
            const count = documents.filter((d) => d.category === cat.key).length;
            const active = activeTab === cat.key;
            const locked = !canAccess(cat.key);
            return (
              <button key={cat.key} onClick={() => selectTab(cat.key)}
                className={`w-full flex items-center justify-between px-3 py-2 rounded-md text-xs ${active ? "bg-white/20 font-bold" : locked ? "opacity-50 text-slate-400" : "text-slate-300 hover:bg-white/10"}`}>
                <span className="flex items-center gap-2.5 truncate">
                  <Icon name={cat.icon} className={active ? "text-blue-300" : "text-slate-400"} />
                  <span className="truncate">{isKm ? cat.labelKm : cat.label}</span>
                </span>
                {locked ? <Icon name="Lock" size={12} className="text-amber-400" />
                  : count > 0 && <span className="text-[10px] px-1.5 py-0.5 rounded-full font-mono bg-white/10">{count}</span>}
              </button>
            );
          })}
        </div>
      </div>

      {/* ផ្នែកខាងក្រោម: ប៊ូតុង Admin/Login + ព័ត៌មានអ្នកប្រើ */}
      <div className="p-3 border-t border-white/10 space-y-2">
        {isAdmin ? (
          <button onClick={() => setModal("permissions")} className="w-full py-1.5 rounded bg-blue-500/20 text-blue-300 text-[10px] font-bold border border-blue-500/30 flex items-center justify-center gap-1.5">
            <Icon name="ShieldCheck" size={14} /><span>{t.managePermissions}</span>
            {users.some((u) => u.status === "pending") && <span className="w-2 h-2 rounded-full bg-amber-400 animate-ping" />}
          </button>
        ) : session ? (
          <button onClick={() => sb.auth.signOut()} className="w-full py-1.5 rounded bg-rose-500/20 text-rose-300 text-[10px] font-bold border border-rose-500/30">Sign out</button>
        ) : (
          <button onClick={() => setModal("login")} className="w-full py-1.5 rounded bg-emerald-500/20 text-emerald-300 text-[10px] font-bold border border-emerald-500/30 flex items-center justify-center gap-1.5">
            <Icon name="LogIn" size={14} /><span>{t.loginGoogle}</span>
          </button>
        )}
        <a href="https://t.me/levi_jine" target="_blank" rel="noopener noreferrer"
          className="w-full py-1.5 rounded text-[10px] font-bold flex items-center justify-center gap-1.5 text-white hover:brightness-110"
          style={{ background: "linear-gradient(90deg, #1D8FD1, #38B6F0)" }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg><span>Telegram · @levi_jine</span>
        </a>
        <div className="flex items-center gap-2.5 pt-1 border-t border-white/10">
          <img src={currentUser.photo} alt="User" className="w-8 h-8 rounded-full border border-blue-400 object-cover" />
          <div className="flex-1 truncate">
            <div className="text-xs font-bold truncate">{currentUser.name} {currentUser.status === "pending" && <span className="text-[9px] text-amber-400">(Pending)</span>}</div>
            <div className="text-[10px] text-slate-400 truncate">{currentUser.email}</div>
          </div>
        </div>
      </div>
    </aside>
  );

  // ===== ក្បាលទំព័រ (Header): ប៊ូតុងតួនាទី, ភាសា, Night Mode =====
  const header = (
    <header className="sticky top-0 z-20 px-3 sm:px-6 py-3 border-b flex flex-wrap items-center justify-between gap-2 shrink-0 bg-white border-slate-200 dark:bg-[#0A0A0A] dark:border-[#222]">
      <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs font-bold">
        <button onClick={() => setSidebarOpen(!sidebarOpen)} title="Menu" className="px-2.5 py-1 rounded-md border border-inherit text-base leading-none">☰</button>
        <span className="hidden sm:inline">Date: {new Date().toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric", year: "numeric" })}</span>
        <span className="text-emerald-600">Active Online: {online}</span>
        {stats.visitors != null
          ? <><span className="text-blue-600" title="Visitors = ចំនួនអ្នកចូលមើល (រាប់ម្នាក់ម្តងក្នុង ១ Browser)">Total Visitors: {stats.visitors.toLocaleString()}</span>
              {isAdmin && <span className="hidden md:inline text-slate-500" title="Visits = ចំនួនដងចូលមើលសរុប (រាប់ម្តងក្នុង ១ session)">Visits: {stats.visits == null ? "…" : stats.visits.toLocaleString()}</span>}</>
          : <span className="text-blue-600">Total Visits: {stats.visits == null ? "…" : stats.visits.toLocaleString()}</span>}
      </div>
      <div className="flex flex-wrap items-center gap-2">
        <button onClick={() => !sb && setDemoRole(role === "admin" ? "staff" : role === "staff" ? "viewer" : "admin")}
          className={`px-3 py-1.5 rounded-md text-xs font-bold border ${isAdmin ? "bg-blue-600 border-blue-600 text-white" : "bg-amber-500/10 border-amber-500/30 text-amber-600"}`}>
          {isAdmin ? t.adminRole : role === "staff" ? t.staffRole : t.viewerRole}
        </button>
        {canEditData && <button onClick={openEditDash} className="px-3 py-1.5 rounded-md text-xs font-bold bg-emerald-600 text-white hover:bg-emerald-700">{t.editDashData}</button>}
        <button onClick={() => setLang(isKm ? "en" : "km")} className="px-2.5 py-1.5 rounded-md text-xs font-bold border border-inherit">{isKm ? "EN" : "ខ្មែរ (KM)"}</button>
        <button onClick={() => setTheme(theme === "light" ? "dark" : "light")} className="p-1.5 rounded-md border border-inherit">
          <Icon name={theme === "light" ? "Moon" : "Sun"} />
        </button>
      </div>
    </header>
  );

  // ===== ទំព័រ Dashboard =====
  const dashboard = (
    <>
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 className="text-lg font-black uppercase">{t.dashboard}</h2>
          <p className="text-[11px] text-slate-500 dark:text-slate-400">{t.projectName}</p>
        </div>
        <button onClick={() => setReport(true)} className="px-3.5 py-2 rounded-md text-xs font-bold bg-blue-600 text-white hover:bg-blue-700 flex items-center gap-2">
          <Icon name="Printer" size={14} />{isKm ? "របាយការណ៍ប្រចាំថ្ងៃ (Print / PDF)" : "Daily Report (Print / PDF)"}
        </button>
      </div>

      {/* ជួរទី ១: វឌ្ឍនភាពសរុប | ចំនួនថ្ងៃ | RFI/RFA/SI/NCR */}
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6">
        <Card className="relative overflow-hidden flex items-center justify-between gap-3">
          <Accent colors={PALETTE.emerald} />
          <div>
            <div className="text-xs font-bold uppercase">{t.overallProject}</div>
            <div className="text-3xl font-black mt-1 tabular-nums">{completePct}%</div>
            {completeMonth && <div className="text-[10px] font-mono text-slate-500 dark:text-slate-400 mt-0.5" title="Auto: Actual ខែចុងក្រោយក្នុង S-Curve">{isKm ? "ត្រឹមខែ" : "as of"} {completeMonth} · auto</div>}
            <div className="flex flex-wrap gap-1.5 mt-2 text-[11px] font-bold">
              <span className="px-2 py-0.5 rounded-full bg-emerald-500/12 text-emerald-600 dark:text-emerald-400">{t.projectComplete}: {completePct}%</span>
              <span className="px-2 py-0.5 rounded-full bg-rose-500/12 text-rose-600 dark:text-rose-400">{t.remaining}: {100 - completePct}%</span>
            </div>
          </div>
          <RingProgress pct={completePct} />
        </Card>

        <Card className="relative overflow-hidden space-y-2.5">
          <Accent colors={PALETTE.amber} />
          <div className="flex justify-between items-center text-xs font-bold uppercase">
            <span>{t.dayElapsed}</span>
            <span className="text-[10px] text-blue-500 font-mono bg-blue-500/10 px-1.5 py-0.5 rounded">{t.autoCalculated}</span>
          </div>
          <div className="flex justify-between items-end">
            <div className="text-2xl font-black tabular-nums">{daysElapsed} / {totalDays} <span className="text-xs font-normal text-slate-500">Days</span></div>
            <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-600 dark:text-amber-400">{t.remainingDays}: {remainingDays}</span>
          </div>
          <div className="flex items-center gap-2">
            <div className="flex-1"><GradientBar percent={(daysElapsed / totalDays) * 100} colors={PALETTE.amber} height="h-3" marker={completePct} /></div>
            <span className="text-[11px] font-black tabular-nums w-9 text-right text-amber-600 dark:text-amber-400">{Math.round((daysElapsed / totalDays) * 100)}%</span>
          </div>
          <div className="flex justify-between text-[10px] font-mono text-slate-500 dark:text-slate-400"><span>Start: {dates.startDate}</span><span title="ខ្សែបញ្ឈរ = វឌ្ឍនភាពសម្រេចបាន">▎= Progress {completePct}%</span><span>End: {dates.endDate}</span></div>
        </Card>

        <Card className="relative overflow-hidden space-y-3">
          <Accent colors={PALETTE.blue} />
          <div className="flex justify-between items-center text-xs font-bold uppercase">
            <span>{t.rfiRfaSiNcrSummary}</span>
            <span className="text-[10px] text-blue-500 font-mono bg-blue-500/10 px-1.5 py-0.5 rounded normal-case">
              {t.totalTrackers}: {["RFI","RFA","SI","NCR"].reduce((n, k) => n + trackerCount(k), 0)}
            </span>
          </div>
          <div className="grid grid-cols-4 gap-2.5 text-center">
            {[
              ["RFI", "Request for Information", trackerCount("RFI"), PALETTE.blue,    "text-blue-600 dark:text-blue-400"],
              ["RFA", "Request for Approval",    trackerCount("RFA"), PALETTE.emerald, "text-emerald-600 dark:text-emerald-400"],
              ["SI",  "Site Instruction",        trackerCount("SI"),   PALETTE.amber,   "text-amber-600 dark:text-amber-400"],
              ["NCR", "Non-Conformance Report",  trackerCount("NCR"), PALETTE.rose,    "text-rose-600 dark:text-rose-400"],
            ].map(([label, full, count, pal, txt]) => (
              <div key={label} title={full} className="relative overflow-hidden rounded-lg border border-inherit pt-3 pb-2.5 px-1 shadow-sm transition-transform hover:-translate-y-0.5"
                style={{ background: `linear-gradient(160deg, ${pal[0]}1F, ${pal[1]}0D)` }}>
                <div className="absolute inset-x-0 top-0 h-[3px]" style={{ background: `linear-gradient(90deg, ${pal[0]}, ${pal[1]})` }} />
                <div className={`text-[10px] font-black tracking-wider ${txt}`}>{label}{isManual(label) && <span title="Manual" className="ml-0.5 opacity-70">✎</span>}</div>
                <div className={`text-3xl font-black tabular-nums leading-tight mt-0.5 ${txt}`}>{count}</div>
                <div className="mx-2 mt-1.5 h-1 rounded-full bg-slate-200/70 dark:bg-slate-800 overflow-hidden">
                  <div className="h-full rounded-full" style={{ width: `${Math.min(100, count * 20)}%`, background: `linear-gradient(90deg, ${pal[0]}, ${pal[1]})` }} />
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>

      {/* ជួរទី ២: ក្រាប S-Curve | គ្រឿងចក្រ | បុគ្គលិក */}
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <Card className="lg:col-span-6">
          <CardTitle icon="ChartColumn" right={
            <div className="flex flex-wrap justify-end gap-2 text-[11px] font-bold">
              <button onClick={() => setZoomChart(true)} title={isKm ? "ពង្រីកក្រាបពេញអេក្រង់" : "Zoom chart full screen"} className="px-2 py-0.5 rounded-full border border-inherit hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-1"><Icon name="Maximize" size={12} />{isKm ? "ពង្រីក" : "Zoom"}</button>
              <span className="flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-700 dark:text-blue-300"><i className="w-2 h-2 rounded-full bg-[#3B5BDB]" />Planned</span>
              <span className="flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-rose-500/10 text-rose-700 dark:text-rose-300"><i className="w-2 h-2 rounded-full bg-[#E11D48]" />Actual</span>
            </div>
          }>{t.sCurveTitle}</CardTitle>
          <SCurveChart data={sCurve} />
        </Card>

        {/* បញ្ជីគ្រឿងចក្រ និងបុគ្គលិក (រចនាដូចគ្នា ប្រើ loop ម្តង; ប៊ូតុង Edit សម្រាប់ Admin/Staff ដែលបានអនុញ្ញាត) */}
        {[
          ["machinery", t.machineryTitle, "Truck", "text-amber-600", "bg-amber-500/10 text-amber-600"],
          ["manpower", t.manpowerTitle, "HardHat", "text-blue-600", "bg-blue-500/10 text-blue-600"],
        ].map(([key, title, icon, iconColor, qtyColor]) => (
          <Card key={key} className="lg:col-span-3 flex flex-col">
            <CardTitle icon={icon} iconColor={iconColor} right={editBtn(key)}>{title}</CardTitle>
            <div className="space-y-2 flex-1 min-h-0 max-h-[24rem] overflow-y-auto pr-1">
              {data[key].map((row, i) => (
                <div key={i} className="flex justify-between items-center text-xs p-1.5 rounded bg-slate-50 dark:bg-slate-900 border border-inherit">
                  <span>{row.name}</span>
                  <span className={`font-mono font-bold px-2 py-0.5 rounded ${qtyColor}`}>{row.qty}</span>
                </div>
              ))}
            </div>
          </Card>
        ))}
      </div>

      {/* ជួរទី ៣: Milestones | កម្លាំងប្រចាំសប្តាហ៍ | Drone + អាកាសធាតុ + ផែនទី */}
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <Card className="lg:col-span-4">
          <CardTitle icon="Clock" right={editBtn("milestones")}>{t.masterScheduleTitle}</CardTitle>
          <div className="space-y-3">
            {data.milestones.map((item, i) => {
              const st = milestoneStatus(item);
              return (
                <div key={i} className="p-3 rounded-xl border border-slate-200/80 dark:border-[#222] bg-slate-50/60 dark:bg-slate-900/50 text-xs space-y-2">
                  <div className="flex items-start justify-between gap-2">
                    <span className="font-bold leading-snug min-w-0 break-words">{item.title}</span>
                    <span className="font-black text-sm tabular-nums" style={{ color: st.colors[0] }}>{item.actual}%</span>
                  </div>
                  <GradientBar percent={item.actual} colors={st.colors} marker={item.planned} />
                  <div className="flex flex-wrap items-center justify-between gap-x-3 gap-y-1.5 text-[10px]">
                    <span className="flex flex-wrap items-center gap-1.5">
                      <span className={`px-1.5 py-0.5 rounded-full font-bold ${st.chip}`}>{st.label}{st.gap !== 0 && Number(item.actual) < 100 ? ` ${st.gap > 0 ? "+" : ""}${st.gap}%` : ""}</span>
                      <span className="text-slate-500 dark:text-slate-400">▎Plan {item.planned}%</span>
                    </span>
                    <span className="font-mono text-slate-500 dark:text-slate-400 whitespace-nowrap">{item.startDate} → {item.endDate}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </Card>

        <Card className="lg:col-span-4">
          <CardTitle icon="Activity" right={editBtn("weekly")}>{t.weeklyPerformance}</CardTitle>
          <div className="space-y-3">
            {data.weekly.map((w, i) => (
              <div key={i} className="p-3 rounded-xl border border-slate-200/80 dark:border-[#222] bg-slate-50/60 dark:bg-slate-900/50 space-y-2.5">
                <div className="flex justify-between items-center text-xs font-bold"><span>{w.week}</span><span className="text-[10px] font-mono text-slate-500 dark:text-slate-400">{w.dateRange}</span></div>
                <div className="space-y-1">
                  <div className="flex justify-between text-[10px] font-bold"><span style={{ color: PALETTE.blue[0] }}>Workers</span><span className="tabular-nums" style={{ color: PALETTE.blue[0] }}>{w.worker} Persons</span></div>
                  <GradientBar percent={w.worker} colors={PALETTE.blue} height="h-2" />  {/* ១០០ នាក់ = ពេញរបារ */}
                </div>
                <div className="space-y-1">
                  <div className="flex justify-between text-[10px] font-bold text-amber-600 dark:text-amber-400"><span>Machinery</span><span className="tabular-nums">{w.machinery} Units</span></div>
                  <GradientBar percent={(w.machinery / 15) * 100} colors={PALETTE.amber} height="h-2" /> {/* ១៥ គ្រឿង = ពេញរបារ */}
                </div>
              </div>
            ))}
          </div>
        </Card>

        <Card className="lg:col-span-4 space-y-4">
          <DroneGallery images={photos} title={t.droneGalleryTitle} canEdit={canEditData} onChange={setPhotos} isKm={isKm} />
          {/* អាកាសធាតុពិត: ថ្ងៃនេះ + ម៉ោងបន្ទាប់ + ៥ ថ្ងៃខាងមុខ */}
          <WeatherWidget t={t} isKm={isKm} />
          {/* ផែនទី Google Maps ពីអាសយដ្ឋានគម្រោង */}
          <div>
            <div className="text-[11px] font-bold uppercase mb-1 truncate">{PROJECT_ADDRESS}</div>
            <iframe title="Site map" className="w-full h-44 rounded-md border-0" loading="lazy"
              src={`https://maps.google.com/maps?q=${LOC.lat},${LOC.lon}&t=k&z=16&output=embed`} />
          </div>
        </Card>
      </div>

      {/* ជួរទី ៤: ឯកសារថ្មីៗ ៥ ឯកសារចុងក្រោយ */}
      <Card>
        <CardTitle right={
          <button onClick={() => selectTab("catDrawing")} className="text-xs font-bold text-blue-600 flex items-center gap-1">
            <span>{t.viewAllFiles}</span><Icon name="ChevronRight" size={14} />
          </button>
        }>{t.incomingDocuments} <span className="ml-2 normal-case px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-600 dark:text-blue-400 text-[10px] font-mono">{t.totalFiles}: {totalDocs}</span></CardTitle>
        <DocsTable docs={recentDocs} t={t} isAdmin={isAdmin} onDelete={deleteDocument} onOpen={openDoc} />
      </Card>

      {/* Promote Telegram Channel */}
      <a href="https://t.me/levi_jine" target="_blank" rel="noopener noreferrer"
        className="group relative overflow-hidden rounded-xl p-4 sm:p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 text-white shadow-lg transition-transform hover:-translate-y-0.5"
        style={{ background: "linear-gradient(110deg, #1D8FD1 0%, #229ED9 45%, #38B6F0 100%)" }}>
        <div className="pointer-events-none absolute -right-10 -top-10 w-40 h-40 rounded-full bg-white/10" />
        <div className="pointer-events-none absolute right-24 -bottom-12 w-32 h-32 rounded-full bg-white/10" />
        <div className="relative flex items-center gap-4">
          <div className="w-12 h-12 shrink-0 rounded-full bg-white/20 backdrop-blur grid place-items-center ring-2 ring-white/40 group-hover:rotate-12 transition-transform">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
          </div>
          <div>
            <div className="text-sm sm:text-base font-black leading-tight">{isKm ? "ចូលរួម Channel Telegram របស់ខ្ញុំ" : "Join my Telegram Channel"}</div>
            <div className="text-[11px] sm:text-xs text-white/85 mt-0.5">{isKm ? "ទទួលព័ត៌មាន និងឯកសារថ្មីៗ ជាមុនគេ" : "Get the latest updates and documents first"} · <span className="font-mono font-bold">@levi_jine</span></div>
          </div>
        </div>
        <span className="relative shrink-0 inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white text-[#1D8FD1] text-xs font-black shadow group-hover:shadow-md">
          <span className="relative flex w-2 h-2"><span className="absolute inline-flex w-full h-full rounded-full bg-[#229ED9] opacity-60 animate-ping" /><span className="relative inline-flex w-2 h-2 rounded-full bg-[#229ED9]" /></span>
          {isKm ? "ចូលរួមឥឡូវនេះ" : "Join now"}
        </span>
      </a>
    </>
  );

  // ===== ទំព័រប្រភេទឯកសារ (Drawing, Method Statement, ...) =====
  const customPanel = currentCategory && CUSTOM_SUB_BY_CAT[currentCategory.key] === activeSub ? currentCategory.key : null;
  const isRevision = !!customPanel;
  const staffOptions = [...new Set([currentUser.name, ...users.map((u) => u.name)].filter(Boolean))];
  const categoryView = currentCategory && (
    <div className="space-y-6">
      <Card className="space-y-4">
        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
          <h2 className="text-lg font-bold uppercase">{isKm ? currentCategory.labelKm : currentCategory.label} <span className="ml-2 normal-case px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-600 dark:text-blue-400 text-xs font-mono">{!isRevision && <>{filteredDocs.length} {t.filesUnit}</>}{isRevision && activeSub}</span></h2>
          {canEditData && !isRevision && (
            <button onClick={() => setModal("upload")} className="px-4 py-2 rounded-md bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs flex items-center gap-2">
              <Icon name="Upload" /><span>{t.uploadFile}</span>
            </button>
          )}
        </div>

        {/* ប៊ូតុង Sub-Folder (បង្ហាញជាខ្មែរ តែចម្រោះតាមឈ្មោះអង់គ្លេស) */}
        {currentCategory.subFolders.length > 0 && (
          <div className="flex items-center gap-2 overflow-x-auto pb-1 pt-2 border-t border-inherit">
            <span className="text-xs font-bold text-slate-500 mr-2">{t.subCategoryHeading}:</span>
            {currentCategory.subFolders.map((sub, i) => (
              <button key={sub} onClick={() => setActiveSub(sub)}
                className={`px-3 py-1.5 rounded-md text-xs font-bold whitespace-nowrap ${activeSub === sub ? "bg-blue-600 text-white" : "bg-slate-100 dark:bg-slate-800 hover:bg-slate-200"}`}>
                {isKm ? currentCategory.subFoldersKm[i] : sub}
              </button>
            ))}
          </div>
        )}

        {/* ស្វែងរក + តម្រង Format + តម្រង Status + តម្រៀប */}
        {!isRevision && <div className="grid grid-cols-1 md:grid-cols-4 gap-3 pt-3 border-t border-inherit">
          <div className="relative">
            <Icon name="Search" className="absolute left-3 top-2.5 text-slate-400" />
            <input type="text" placeholder={t.searchPlaceholder} value={filters.search}
              onChange={(e) => setFilters({ ...filters, search: e.target.value })} className={`${INPUT} pl-9`} />
          </div>
          <select value={filters.format} onChange={(e) => setFilters({ ...filters, format: e.target.value })} className={INPUT}>
            <option value="ALL">{t.formatFilter}</option>
            {FORMATS.map((f) => <option key={f} value={f}>{f}</option>)}
          </select>
          <select value={filters.status} onChange={(e) => setFilters({ ...filters, status: e.target.value })} className={INPUT}>
            <option value="ALL">{t.statusFilter}</option>
            {STATUSES.map((s) => <option key={s} value={s}>{s}</option>)}
          </select>
          <select value={filters.sort} onChange={(e) => setFilters({ ...filters, sort: e.target.value })} className={`${INPUT} font-mono`}>
            <option value="DATE_DESC">{t.sortDateDesc}</option>
            <option value="DATE_ASC">{t.sortDateAsc}</option>
            <option value="NAME_ASC">{t.sortNameAsc}</option>
            <option value="NAME_DESC">{t.sortNameDesc}</option>
          </select>
        </div>}
      </Card>

      {isRevision
        ? <Card>{customPanel === "catMaster" ? <MasterSchedule items={master} onSave={setMaster} canEdit={canEditData} isKm={isKm} t={t} preparedBy={currentUser.name} />
          : customPanel === "catLeave" ? <LeaveCalendar events={calEvents} onSave={setCalEvents} canEdit={canEditData} isKm={isKm} staffOptions={staffOptions} />
          : customPanel === "catWarehouse" ? <StockManager state={stock} onSave={setStock} canEdit={canEditData} isKm={isKm} userName={currentUser.name} />
          : <RequestTracker items={requests} onSave={setRequests} canEdit={canEditData} isKm={isKm} userName={currentUser.name} />}</Card>
        : <Card><DocsTable docs={filteredDocs} t={t} isAdmin={isAdmin} onDelete={deleteDocument} onOpen={openDoc} /></Card>}
